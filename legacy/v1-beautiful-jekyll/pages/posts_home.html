  <style>
    /* Rounded, shadowed frame */
    .home-carousel {
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.15);
      background: #fff;
    }
    /* Keep a strict 3:4 box regardless of content */
    .home-carousel { aspect-ratio: 3 / 4; }
    /* Make slides fill the box and crop centrally */
    .home-carousel .carousel-item,
    .home-carousel .carousel-inner { height: 100%; }
    .home-carousel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
    }
    /* Bigger, easier arrows */
    .home-carousel .carousel-control-prev,
    .home-carousel .carousel-control-next {
      width: 12%;
    }
    .home-carousel .carousel-control-prev-icon,
    .home-carousel .carousel-control-next-icon {
      filter: drop-shadow(0 2px 2px rgba(0,0,0,.45));
    }
    /* Dots */
    .home-carousel .carousel-indicators { bottom: 10px; }
    .home-carousel .carousel-indicators li {
      width: 10px; height: 10px; border-radius: 50%;
    }

    /* News: 두 컬럼(날짜 | 내용) 정렬 */
    .news-list{
      display: grid;
      grid-template-columns: max-content 1fr; /* 날짜 폭 = 내용과 무관, 내용은 남은 폭 */
      column-gap: 1.25rem;
      row-gap: .75rem;
      align-items: start;
    }
    .news-list .news-date{ 
      font-weight: 700; 
      white-space: nowrap;   /* 줄바꿈 없이 날짜 유지 */
    }
    .news-list p{ 
      margin: 0;             /* 행 간격은 row-gap으로만 제어 */
    }

    /* 모바일에서는 한 줄씩 세로 배치 */
    @media (max-width: 576px){
      .news-list{ grid-template-columns: 1fr; }
      .news-list .news-date{ margin-bottom: .125rem; }
    }

    /* Social Links - Rounded Square Buttons */
    .social-links .btn-social-icon .fa-circle {
      border-radius: 15% !important;
    }
    .social-links .btn-social-icon .fa-stack-2x {
      border-radius: 15%;
    }

  </style>
