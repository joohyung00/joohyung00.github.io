<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tree-search — Building Document Trees and Index Cards</title>
<style>
  :root{
    --bg:#0a0e1a; --bg2:#0f1525; --panel:#161f35; --panel2:#1b2640;
    --ink:#eef3fb; --muted:#9aa7c5; --dim:#5a6a8a;
    --accent:#7cc4ff; --amber:#ffc06b; --ok:#7ee787; --warn:#ff7b72;
    --purple:#c084fc; --pink:#ff8fd8; --edge:#2a3a58; --code-bg:#050810;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(ellipse at top,var(--bg2) 0%,var(--bg) 60%) fixed,var(--bg);
    display:grid; place-items:center; min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",Roboto,sans-serif;
    color:var(--ink);
  }
  .slide{
    width:min(100vw,177.78vh); aspect-ratio:16/9;
    container-type:size; position:relative; overflow:hidden;
    background:linear-gradient(160deg,#0c1222 0%,#0a0e1a 100%);
    border:1px solid var(--edge);
    display:flex; flex-direction:column; padding:5.6cqw 6cqw 5cqw;
  }
  h1{ margin:0; font-weight:800; letter-spacing:-.05cqw; font-size:3.6cqw; line-height:1.08; padding-bottom:1.4cqw; border-bottom:1px solid var(--edge); }
  h1 .grad{ background:linear-gradient(135deg,var(--accent),var(--purple),var(--pink)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .body{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:1.4cqw; }
  .lead{ color:var(--muted); font-size:2.0cqw; margin:0; line-height:1.45; }
  p,li{ font-size:2.0cqw; line-height:1.45; margin:.4cqw 0; }
  ul{ margin:0; padding-left:2.4cqw; list-style:none; }
  ul li{ position:relative; margin:.7cqw 0; }
  ul li::before{ content:"–"; position:absolute; left:-2.2cqw; color:var(--purple); font-weight:700; }
  ul ul{ margin:.3cqw 0; }
  ul ul li{ font-size:1.7cqw; color:var(--muted); }
  ul ul li::before{ content:"·"; color:var(--dim); }
  .small{ font-size:1.55cqw; color:var(--muted); }
  b,strong{ color:#fff; }
  .accent{color:var(--accent);} .ok{color:var(--ok);} .warn{color:var(--warn);}
  .amber{color:var(--amber);} .purple{color:var(--purple);} .pink{color:var(--pink);} .dim{color:var(--dim);}
  .math{ font-family:"Cambria Math",Georgia,"Times New Roman",serif; }
  .slot{ font-family:"Cambria Math",Georgia,serif; color:var(--pink); }
  code{ font-family:ui-monospace,"JetBrains Mono",monospace; background:var(--panel); color:var(--amber); padding:.1cqw .6cqw; border-radius:.5cqw; border:1px solid var(--edge); font-size:.85em; }
  .card{ background:var(--panel); border:1px solid var(--edge); border-radius:1.1cqw; padding:1.4cqw 1.7cqw; }
  .two{ display:grid; grid-template-columns:1fr 1fr; gap:1.6cqw; }
  .three{ display:grid; grid-template-columns:repeat(3,1fr); gap:1.4cqw; }
  table{ width:100%; border-collapse:collapse; font-size:1.65cqw; }
  th,td{ border:1px solid var(--edge); padding:.7cqw 1cqw; text-align:left; vertical-align:middle; }
  th{ background:var(--bg2); color:var(--accent); font-weight:700; }
  .num{ text-align:right; font-family:ui-monospace,monospace; }
  .chip{ display:inline-block; padding:.35cqw 1.1cqw; border-radius:5cqw; font-size:1.4cqw; font-weight:700; border:1px solid var(--accent); color:var(--accent); background:rgba(124,196,255,.12); }
  .chip.ok{ border-color:var(--ok); color:var(--ok); background:rgba(126,231,135,.12); }
  .chip.warn{ border-color:var(--warn); color:var(--warn); background:rgba(255,123,114,.12); }
  .note{ background:rgba(124,196,255,.07); border-left:.4cqw solid var(--accent); padding:1cqw 1.5cqw; border-radius:0 .8cqw .8cqw 0; font-size:1.7cqw; }
  .callout{ background:linear-gradient(135deg,rgba(192,132,252,.10),rgba(124,196,255,.06)); border:1px solid var(--purple); border-radius:1.1cqw; padding:1.3cqw 1.7cqw; font-size:1.9cqw; }
  svg{ width:100%; height:auto; display:block; }
  .foot{ position:absolute; right:6cqw; bottom:2.6cqw; font-size:1.3cqw; color:var(--dim); font-family:ui-monospace,monospace; }
</style></head>
<body>
<div class="slide">
  <h1>Building Document Trees and Index Cards</h1>
  <div class="body">


<svg viewBox="0 0 1200 400">
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
    <path d="M0,0 L9,4.5 L0,9 z" fill="#9aa7c5"/></marker></defs>
  <!-- page -->
  <rect x="24" y="50" width="200" height="270" rx="10" fill="#131b30" stroke="#2a3a58"/>
  <text x="124" y="34" fill="#9aa7c5" font-size="16" text-anchor="middle">a PDF page</text>
  <rect x="44" y="72" width="160" height="40" rx="5" fill="rgba(124,196,255,.13)" stroke="#7cc4ff"/>
  <text x="124" y="97" fill="#7cc4ff" font-size="13" text-anchor="middle">paragraph</text>
  <rect x="44" y="124" width="160" height="70" rx="5" fill="rgba(255,192,107,.13)" stroke="#ffc06b"/>
  <text x="124" y="163" fill="#ffc06b" font-size="13" text-anchor="middle">table</text>
  <rect x="44" y="206" width="160" height="60" rx="5" fill="rgba(255,143,216,.13)" stroke="#ff8fd8"/>
  <text x="124" y="240" fill="#ff8fd8" font-size="13" text-anchor="middle">figure</text>
  <rect x="44" y="278" width="160" height="28" rx="5" fill="rgba(124,196,255,.13)" stroke="#7cc4ff"/>
  <line x1="230" y1="185" x2="286" y2="185" stroke="#9aa7c5" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="258" y="166" fill="#9aa7c5" font-size="14" text-anchor="middle">auto-parse</text>
  <!-- tree -->
  <rect x="292" y="50" width="380" height="270" rx="14" fill="#131b30" stroke="#2a3a58"/>
  <text x="482" y="34" fill="#9aa7c5" font-size="16" text-anchor="middle">tree · every unit gets its heading path</text>
  <g stroke="#2a3a58" stroke-width="1.5">
    <line x1="482" y1="90" x2="388" y2="126"/><line x1="482" y1="90" x2="566" y2="126"/>
    <line x1="566" y1="152" x2="566" y2="186"/>
    <line x1="566" y1="212" x2="371" y2="248"/><line x1="566" y1="212" x2="490" y2="248"/><line x1="566" y1="212" x2="606" y2="248"/>
  </g>
  <rect x="428" y="62" width="108" height="28" rx="9" fill="#1b2640" stroke="#c084fc" stroke-width="2"/>
  <text x="482" y="81" fill="#c084fc" font-size="13.5" text-anchor="middle">X100 Manual</text>
  <g font-size="12" text-anchor="middle">
    <rect x="338" y="126" width="100" height="26" rx="8" fill="#101828" stroke="#3a4a6a"/><text x="388" y="144" fill="#5a6a8a">2. Safety</text>
    <rect x="508" y="126" width="116" height="26" rx="8" fill="#1b2640" stroke="#c084fc"/><text x="566" y="144" fill="#c084fc">5. Maintenance</text>
    <rect x="514" y="186" width="104" height="26" rx="8" fill="rgba(255,192,107,.1)" stroke="#ffc06b" stroke-width="2"/><text x="566" y="204" fill="#ffc06b" font-weight="700">5.3 Battery</text>
    <rect x="316" y="248" width="110" height="28" rx="5" fill="rgba(124,196,255,.12)" stroke="#7cc4ff"/><text x="371" y="266" fill="#7cc4ff">text · "consum…"</text>
    <rect x="436" y="248" width="108" height="28" rx="5" fill="rgba(255,192,107,.15)" stroke="#ffc06b"/><text x="490" y="266" fill="#ffc06b">table · intervals</text>
    <rect x="554" y="248" width="106" height="28" rx="5" fill="rgba(255,143,216,.15)" stroke="#ff8fd8"/><text x="607" y="266" fill="#ff8fd8">figure · location</text>
  </g>
  <text x="482" y="306" fill="#5a6a8a" font-size="13" text-anchor="middle">a caption-less figure gets its preceding paragraph attached as context</text>
  <line x1="678" y1="185" x2="734" y2="185" stroke="#9aa7c5" stroke-width="2.5" marker-end="url(#ar)"/>
  <!-- cards -->
  <text x="960" y="34" fill="#9aa7c5" font-size="16" text-anchor="middle">two kinds of search cards</text>
  <rect x="740" y="44" width="440" height="150" rx="12" fill="#1b2640" stroke="#c084fc" stroke-width="2"/>
  <text x="762" y="70" fill="#c084fc" font-size="15.5" font-weight="700">Doc card · one per document</text>
  <rect x="756" y="80" width="408" height="82" rx="8" fill="#0f1525" stroke="#2a3a58"/>
  <g font-family="ui-monospace,monospace">
    <text x="772" y="102" fill="#eef3fb" font-size="13" font-weight="700">X100 User Manual</text>
    <text x="786" y="122" fill="#5a6a8a" font-size="12">├ 2. Safety</text>
    <text x="786" y="142" fill="#ffc06b" font-size="12">└ 5. Maintenance › 5.3 Battery</text>
    <text x="1150" y="142" fill="#5a6a8a" font-size="11" text-anchor="end">… every path</text>
  </g>
  <text x="762" y="184" fill="#9aa7c5" font-size="11.5">= title + the <tspan fill="#eef3fb" font-weight="700">whole hierarchy skeleton</tspan> · paths only, no contents</text>
  <rect x="740" y="208" width="440" height="172" rx="12" fill="#1b2640" stroke="#7cc4ff" stroke-width="2"/>
  <text x="762" y="234" fill="#7cc4ff" font-size="15.5" font-weight="700">Section card · one per section</text>
  <text x="762" y="258" fill="#ffc06b" font-size="12.5" font-family="ui-monospace,monospace">§ 5.3 Battery · path: X100 › 5. Maintenance</text>
  <!-- component pictograms -->
  <g>
    <rect x="770" y="272" width="28" height="28" rx="4" fill="rgba(124,196,255,.1)" stroke="#7cc4ff" stroke-width="1.6"/>
    <rect x="776" y="279" width="16" height="3" rx="1.5" fill="#7cc4ff"/>
    <rect x="776" y="286" width="12" height="3" rx="1.5" fill="#7cc4ff"/>
    <rect x="776" y="293" width="16" height="3" rx="1.5" fill="#7cc4ff"/>
    <text x="806" y="284" fill="#7cc4ff" font-size="12.5" font-weight="700">text</text>
    <text x="806" y="300" fill="#5a6a8a" font-size="11">"consum…"</text>
    <rect x="908" y="272" width="28" height="28" rx="4" fill="rgba(255,192,107,.1)" stroke="#ffc06b" stroke-width="1.6"/>
    <line x1="908" y1="286" x2="936" y2="286" stroke="#ffc06b" stroke-width="1.4"/>
    <line x1="922" y1="272" x2="922" y2="300" stroke="#ffc06b" stroke-width="1.4"/>
    <text x="944" y="284" fill="#ffc06b" font-size="12.5" font-weight="700">table</text>
    <text x="944" y="300" fill="#5a6a8a" font-size="11">intervals</text>
    <rect x="1046" y="272" width="28" height="28" rx="4" fill="rgba(255,143,216,.1)" stroke="#ff8fd8" stroke-width="1.6"/>
    <circle cx="1055" cy="281" r="3" fill="#ff8fd8"/>
    <path d="M1049 296 L1056 287 L1061 292 L1065 287 L1070 296" stroke="#ff8fd8" stroke-width="1.5" fill="none"/>
    <text x="1080" y="284" fill="#ff8fd8" font-size="12.5" font-weight="700">figure</text>
    <text x="1080" y="300" fill="#5a6a8a" font-size="11">location</text>
  </g>
  <text x="762" y="332" fill="#9aa7c5" font-size="11.5">= its name (path) + <tspan fill="#eef3fb" font-weight="700">every component beneath it</tspan>, each searchable</text>
  <text x="762" y="356" fill="#5a6a8a" font-size="11">components keep their native form · tables &amp; figures never flattened to text</text>
</svg>
<ul>
  <li><b>Structure becomes a first-class search signal</b> · heading paths live inside the cards</li>
  <li><b>Tables and figures become first-class targets</b> · the blank in the lineage, filled</li>
</ul>


  </div>
  <div class="foot">22 / 32</div>
</div>
</body></html>
