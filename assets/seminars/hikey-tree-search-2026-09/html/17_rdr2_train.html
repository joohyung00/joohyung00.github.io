<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tree-search — RDR2: Training the Router</title>
<style>
  :root{
    --bg:#0a0e1a; --bg2:#0f1525; --panel:#161f35; --panel2:#1b2640;
    --ink:#eef3fb; --muted:#9aa7c5; --dim:#5a6a8a;
    --accent:#7cc4ff; --amber:#ffc06b; --ok:#7ee787; --warn:#ff7b72;
    --purple:#c084fc; --pink:#ff8fd8; --edge:#2a3a58; --code-bg:#050810;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(ellipse at top,var(--bg2) 0%,var(--bg) 60%) fixed,var(--bg);
    display:grid; place-items:center; min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",Roboto,sans-serif;
    color:var(--ink);
  }
  .slide{
    width:min(100vw,177.78vh); aspect-ratio:16/9;
    container-type:size; position:relative; overflow:hidden;
    background:linear-gradient(160deg,#0c1222 0%,#0a0e1a 100%);
    border:1px solid var(--edge);
    display:flex; flex-direction:column; padding:5.6cqw 6cqw 5cqw;
  }
  h1{ margin:0; font-weight:800; letter-spacing:-.05cqw; font-size:3.6cqw; line-height:1.08; padding-bottom:1.4cqw; border-bottom:1px solid var(--edge); }
  h1 .grad{ background:linear-gradient(135deg,var(--accent),var(--purple),var(--pink)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .body{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:1.4cqw; }
  .lead{ color:var(--muted); font-size:2.0cqw; margin:0; line-height:1.45; }
  p,li{ font-size:2.0cqw; line-height:1.45; margin:.4cqw 0; }
  ul{ margin:0; padding-left:2.4cqw; list-style:none; }
  ul li{ position:relative; margin:.7cqw 0; }
  ul li::before{ content:"–"; position:absolute; left:-2.2cqw; color:var(--purple); font-weight:700; }
  ul ul{ margin:.3cqw 0; }
  ul ul li{ font-size:1.7cqw; color:var(--muted); }
  ul ul li::before{ content:"·"; color:var(--dim); }
  .small{ font-size:1.55cqw; color:var(--muted); }
  b,strong{ color:#fff; }
  .accent{color:var(--accent);} .ok{color:var(--ok);} .warn{color:var(--warn);}
  .amber{color:var(--amber);} .purple{color:var(--purple);} .pink{color:var(--pink);} .dim{color:var(--dim);}
  .math{ font-family:"Cambria Math",Georgia,"Times New Roman",serif; }
  .slot{ font-family:"Cambria Math",Georgia,serif; color:var(--pink); }
  code{ font-family:ui-monospace,"JetBrains Mono",monospace; background:var(--panel); color:var(--amber); padding:.1cqw .6cqw; border-radius:.5cqw; border:1px solid var(--edge); font-size:.85em; }
  .card{ background:var(--panel); border:1px solid var(--edge); border-radius:1.1cqw; padding:1.4cqw 1.7cqw; }
  .two{ display:grid; grid-template-columns:1fr 1fr; gap:1.6cqw; }
  .three{ display:grid; grid-template-columns:repeat(3,1fr); gap:1.4cqw; }
  table{ width:100%; border-collapse:collapse; font-size:1.65cqw; }
  th,td{ border:1px solid var(--edge); padding:.7cqw 1cqw; text-align:left; vertical-align:middle; }
  th{ background:var(--bg2); color:var(--accent); font-weight:700; }
  .num{ text-align:right; font-family:ui-monospace,monospace; }
  .chip{ display:inline-block; padding:.35cqw 1.1cqw; border-radius:5cqw; font-size:1.4cqw; font-weight:700; border:1px solid var(--accent); color:var(--accent); background:rgba(124,196,255,.12); }
  .chip.ok{ border-color:var(--ok); color:var(--ok); background:rgba(126,231,135,.12); }
  .chip.warn{ border-color:var(--warn); color:var(--warn); background:rgba(255,123,114,.12); }
  .note{ background:rgba(124,196,255,.07); border-left:.4cqw solid var(--accent); padding:1cqw 1.5cqw; border-radius:0 .8cqw .8cqw 0; font-size:1.7cqw; }
  .callout{ background:linear-gradient(135deg,rgba(192,132,252,.10),rgba(124,196,255,.06)); border:1px solid var(--purple); border-radius:1.1cqw; padding:1.3cqw 1.7cqw; font-size:1.9cqw; }
  svg{ width:100%; height:auto; display:block; }
  .foot{ position:absolute; right:6cqw; bottom:2.6cqw; font-size:1.3cqw; color:var(--dim); font-family:ui-monospace,monospace; }
</style><style>
  .arcline{ display:flex; gap:.55cqw; align-items:center; font-size:1.18cqw; color:var(--dim);
            font-family:ui-monospace,monospace; flex-wrap:nowrap; }
  .arcline .st{ padding:.18cqw .75cqw; border:1px solid var(--edge); border-radius:5cqw; white-space:nowrap; }
  .arcline .st.cur{ border-color:var(--amber); color:var(--amber); background:rgba(255,192,107,.10); font-weight:700; }
  .arcline .sep{ color:var(--edge); }
</style></head>
<body>
<div class="slide">
  <h1>RDR2: Training the Router</h1>
  <div class="body">
<div class="arcline"><span class="st">① a tree, no traversal</span><span class="sep">→</span><span class="st">② score-based, both ways</span><span class="sep">→</span><span class="st">③ LLM-guided instead</span><span class="sep">→</span><span class="st cur">④ traversal learned</span><span class="sep">→</span><span class="st">⑤ multimodal</span></div>

<svg viewBox="0 0 1200 420">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#9aa7c5"/></marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#7ee787"/></marker>
  </defs>

  <rect x="24" y="24" width="1152" height="36" rx="10" fill="rgba(255,123,114,.07)" stroke="#ff7b72"/>
  <text x="600" y="47" fill="#eef3fb" font-size="13" text-anchor="middle">the obstacle · standard RAG data gives a question and an answer, but <tspan fill="#ff7b72" font-weight="700">no routing trajectory to imitate</tspan></text>

  <text x="600" y="88" fill="#7ee787" font-size="13.5" font-weight="700" text-anchor="middle">action curation · manufacture the trajectories from the question alone</text>

  <!-- step 1 -->
  <rect x="24" y="102" width="200" height="150" rx="12" fill="#131b30" stroke="#2a3a58"/>
  <text x="124" y="126" fill="#ffc06b" font-size="12" font-weight="700" text-anchor="middle">① a question</text>
  <rect x="48" y="140" width="152" height="46" rx="9" fill="#2b2413" stroke="#ffc06b"/>
  <text x="124" y="160" fill="#eef3fb" font-size="11" text-anchor="middle">"who played</text>
  <text x="124" y="176" fill="#eef3fb" font-size="11" text-anchor="middle">wonder woman?"</text>
  <text x="124" y="208" fill="#7ee787" font-size="10.5" text-anchor="middle">the answer is never used</text>
  <text x="124" y="228" fill="#5a6a8a" font-size="10" text-anchor="middle">so any question set works</text>
  <line x1="228" y1="177" x2="248" y2="177" stroke="#9aa7c5" stroke-width="2" marker-end="url(#ar)"/>

  <!-- step 2 -->
  <rect x="252" y="102" width="252" height="150" rx="12" fill="#131b30" stroke="#2a3a58"/>
  <text x="378" y="126" fill="#ffc06b" font-size="12" font-weight="700" text-anchor="middle">② build the state</text>
  <g font-size="10.5">
    <rect x="272" y="140" width="212" height="24" rx="7" fill="#1b2640" stroke="#3a4a6a"/>
    <text x="378" y="156" fill="#9aa7c5" text-anchor="middle">off-the-shelf retriever → top-k</text>
    <rect x="272" y="170" width="212" height="24" rx="7" fill="#1b2640" stroke="#3a4a6a"/>
    <text x="378" y="186" fill="#9aa7c5" text-anchor="middle">their originating documents</text>
    <rect x="272" y="200" width="212" height="24" rx="7" fill="#1b2640" stroke="#c084fc"/>
    <text x="378" y="216" fill="#c084fc" text-anchor="middle">→ retrieval subtree s</text>
  </g>
  <text x="378" y="242" fill="#5a6a8a" font-size="10" text-anchor="middle">the same state the router sees at inference</text>
  <line x1="508" y1="177" x2="528" y2="177" stroke="#9aa7c5" stroke-width="2" marker-end="url(#ar)"/>

  <!-- step 3 -->
  <rect x="532" y="102" width="286" height="150" rx="12" fill="#131b30" stroke="#ff8fd8" stroke-width="2"/>
  <text x="675" y="126" fill="#ffc06b" font-size="12" font-weight="700" text-anchor="middle">③ a teacher writes the actions</text>
  <rect x="556" y="138" width="238" height="30" rx="10" fill="#2b1a2b" stroke="#ff8fd8"/>
  <text x="675" y="158" fill="#ff8fd8" font-size="11.5" text-anchor="middle">DeepSeek-v3 · sees (q, s)</text>
  <g font-family="ui-monospace,monospace" font-size="10.5">
    <text x="566" y="190" fill="#c084fc">[EXP] 5: ===Television===</text>
    <text x="566" y="210" fill="#7ee787">[ANS] 6,7: Cathy Lee Crosby…</text>
    <text x="566" y="230" fill="#ff7b72">[REF] −1</text>
  </g>
  <text x="675" y="246" fill="#5a6a8a" font-size="10" text-anchor="middle">one step's worth of actions, not a full trajectory</text>
  <line x1="822" y1="177" x2="842" y2="177" stroke="#9aa7c5" stroke-width="2" marker-end="url(#ar)"/>

  <!-- step 4 -->
  <rect x="846" y="102" width="330" height="150" rx="12" fill="#131b30" stroke="#7ee787" stroke-width="2"/>
  <text x="1011" y="126" fill="#ffc06b" font-size="12" font-weight="700" text-anchor="middle">④ the training set</text>
  <rect x="872" y="140" width="278" height="34" rx="9" fill="rgba(126,231,135,.08)" stroke="#7ee787"/>
  <text x="1011" y="162" fill="#7ee787" font-size="13" text-anchor="middle" font-family="ui-monospace,monospace">⟨ q , s , A ⟩</text>
  <text x="1011" y="192" fill="#9aa7c5" font-size="11" text-anchor="middle">ASQA training questions</text>
  <text x="1011" y="212" fill="#eef3fb" font-size="12" text-anchor="middle" font-weight="700">23,827 samples</text>
  <text x="1011" y="234" fill="#5a6a8a" font-size="10" text-anchor="middle">no human annotation anywhere</text>

  <line x1="1011" y1="256" x2="1011" y2="278" stroke="#7ee787" stroke-width="2" marker-end="url(#arG)"/>

  <!-- SFT -->
  <rect x="640" y="284" width="536" height="106" rx="12" fill="#131b30" stroke="#7ee787" stroke-width="2"/>
  <text x="908" y="308" fill="#7ee787" font-size="13" font-weight="700" text-anchor="middle">supervised fine-tuning · plain next-token prediction</text>
  <text x="908" y="336" fill="#eef3fb" font-size="15" text-anchor="middle" font-family="ui-monospace,monospace">ℒ = − log P(A | q, s)</text>
  <text x="908" y="358" fill="#9aa7c5" font-size="10.5" text-anchor="middle">cross-entropy on the output tokens only</text>
  <text x="908" y="378" fill="#9aa7c5" font-size="10.5" text-anchor="middle">Llama-3.1-8B-Instruct + LoRA · 3.5 epochs</text>

  <!-- two notes -->
  <rect x="24" y="284" width="596" height="50" rx="10" fill="rgba(255,192,107,.06)" stroke="#ffc06b"/>
  <text x="40" y="306" fill="#ffc06b" font-size="11.5" font-weight="700">trained on single steps, never on whole trajectories</text>
  <text x="40" y="324" fill="#9aa7c5" font-size="10.5">the model learns "what to do in this state"; the iteration is left to inference</text>
  <rect x="24" y="340" width="596" height="50" rx="10" fill="rgba(192,132,252,.06)" stroke="#c084fc"/>
  <text x="40" y="362" fill="#c084fc" font-size="11.5" font-weight="700">the output format carries the node id</text>
  <text x="40" y="380" fill="#9aa7c5" font-size="10.5" font-family="ui-monospace,monospace">"[ACTION] id: text_prefix" — every action is bound to a real node</text>
</svg>

  </div>
  <div class="foot">17 / 32</div>
</div>
</body></html>
