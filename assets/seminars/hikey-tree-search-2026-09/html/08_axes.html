<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tree-search — Two Design Axes from Build and Traverse</title>
<style>
  :root{
    --bg:#0a0e1a; --bg2:#0f1525; --panel:#161f35; --panel2:#1b2640;
    --ink:#eef3fb; --muted:#9aa7c5; --dim:#5a6a8a;
    --accent:#7cc4ff; --amber:#ffc06b; --ok:#7ee787; --warn:#ff7b72;
    --purple:#c084fc; --pink:#ff8fd8; --edge:#2a3a58; --code-bg:#050810;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(ellipse at top,var(--bg2) 0%,var(--bg) 60%) fixed,var(--bg);
    display:grid; place-items:center; min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",Roboto,sans-serif;
    color:var(--ink);
  }
  .slide{
    width:min(100vw,177.78vh); aspect-ratio:16/9;
    container-type:size; position:relative; overflow:hidden;
    background:linear-gradient(160deg,#0c1222 0%,#0a0e1a 100%);
    border:1px solid var(--edge);
    display:flex; flex-direction:column; padding:5.6cqw 6cqw 5cqw;
  }
  h1{ margin:0; font-weight:800; letter-spacing:-.05cqw; font-size:3.6cqw; line-height:1.08; padding-bottom:1.4cqw; border-bottom:1px solid var(--edge); }
  h1 .grad{ background:linear-gradient(135deg,var(--accent),var(--purple),var(--pink)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .body{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:1.4cqw; }
  .lead{ color:var(--muted); font-size:2.0cqw; margin:0; line-height:1.45; }
  p,li{ font-size:2.0cqw; line-height:1.45; margin:.4cqw 0; }
  ul{ margin:0; padding-left:2.4cqw; list-style:none; }
  ul li{ position:relative; margin:.7cqw 0; }
  ul li::before{ content:"–"; position:absolute; left:-2.2cqw; color:var(--purple); font-weight:700; }
  ul ul{ margin:.3cqw 0; }
  ul ul li{ font-size:1.7cqw; color:var(--muted); }
  ul ul li::before{ content:"·"; color:var(--dim); }
  .small{ font-size:1.55cqw; color:var(--muted); }
  b,strong{ color:#fff; }
  .accent{color:var(--accent);} .ok{color:var(--ok);} .warn{color:var(--warn);}
  .amber{color:var(--amber);} .purple{color:var(--purple);} .pink{color:var(--pink);} .dim{color:var(--dim);}
  .math{ font-family:"Cambria Math",Georgia,"Times New Roman",serif; }
  .slot{ font-family:"Cambria Math",Georgia,serif; color:var(--pink); }
  code{ font-family:ui-monospace,"JetBrains Mono",monospace; background:var(--panel); color:var(--amber); padding:.1cqw .6cqw; border-radius:.5cqw; border:1px solid var(--edge); font-size:.85em; }
  .card{ background:var(--panel); border:1px solid var(--edge); border-radius:1.1cqw; padding:1.4cqw 1.7cqw; }
  .two{ display:grid; grid-template-columns:1fr 1fr; gap:1.6cqw; }
  .three{ display:grid; grid-template-columns:repeat(3,1fr); gap:1.4cqw; }
  table{ width:100%; border-collapse:collapse; font-size:1.65cqw; }
  th,td{ border:1px solid var(--edge); padding:.7cqw 1cqw; text-align:left; vertical-align:middle; }
  th{ background:var(--bg2); color:var(--accent); font-weight:700; }
  .num{ text-align:right; font-family:ui-monospace,monospace; }
  .chip{ display:inline-block; padding:.35cqw 1.1cqw; border-radius:5cqw; font-size:1.4cqw; font-weight:700; border:1px solid var(--accent); color:var(--accent); background:rgba(124,196,255,.12); }
  .chip.ok{ border-color:var(--ok); color:var(--ok); background:rgba(126,231,135,.12); }
  .chip.warn{ border-color:var(--warn); color:var(--warn); background:rgba(255,123,114,.12); }
  .note{ background:rgba(124,196,255,.07); border-left:.4cqw solid var(--accent); padding:1cqw 1.5cqw; border-radius:0 .8cqw .8cqw 0; font-size:1.7cqw; }
  .callout{ background:linear-gradient(135deg,rgba(192,132,252,.10),rgba(124,196,255,.06)); border:1px solid var(--purple); border-radius:1.1cqw; padding:1.3cqw 1.7cqw; font-size:1.9cqw; }
  svg{ width:100%; height:auto; display:block; }
  .foot{ position:absolute; right:6cqw; bottom:2.6cqw; font-size:1.3cqw; color:var(--dim); font-family:ui-monospace,monospace; }
</style></head>
<body>
<div class="slide">
  <h1>Two Design Axes from Build and Traverse</h1>
  <div class="body">

<svg viewBox="0 0 1200 560">
  <defs><marker id="arS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
    <path d="M0,0 L9,4.5 L0,9 z" fill="#5a6a8a"/></marker>
    <marker id="arA8" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
    <path d="M0,0 L9,4.5 L0,9 z" fill="#ffc06b"/></marker>
    <marker id="arP8" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
    <path d="M0,0 L9,4.5 L0,9 z" fill="#ff8fd8"/></marker></defs>

  <!-- ===== row 1 : BUILD axis ===== -->
  <g>
    <rect x="24" y="46" width="76" height="32" rx="8" fill="rgba(192,132,252,.16)" stroke="#c084fc" stroke-width="2"/>
    <text x="62" y="67" fill="#c084fc" font-size="14" font-weight="700" text-anchor="middle">BUILD</text>
    <line x1="102" y1="62" x2="116" y2="62" stroke="#3a4a6a" stroke-width="2" marker-end="url(#arS)"/>
    <rect x="120" y="46" width="76" height="32" rx="8" fill="#101828" stroke="#3a4a6a"/>
    <text x="158" y="67" fill="#5a6a8a" font-size="14" text-anchor="middle">TRAVERSE</text>
    <line x1="198" y1="62" x2="212" y2="62" stroke="#3a4a6a" stroke-width="2" marker-end="url(#arS)"/>
    <rect x="216" y="46" width="76" height="32" rx="8" fill="#101828" stroke="#3a4a6a"/>
    <text x="254" y="67" fill="#5a6a8a" font-size="14" text-anchor="middle">PACK</text>
    <text x="158" y="104" fill="#c084fc" font-size="13.5" text-anchor="middle">decided at BUILD</text>
  </g>
  <text x="340" y="52" fill="#eef3fb" font-size="19" font-weight="700">Q1 · Where does the hierarchy (tree) come from?</text>
  <text x="340" y="76" fill="#5a6a8a" font-size="13.5">a hierarchy must exist before anyone can traverse it · BUILD has to get one from somewhere</text>
  <line x1="352" y1="112" x2="1138" y2="112" stroke="#3a4a6a" stroke-width="2"/>
  <polygon points="340,112 354,105 354,119" fill="#7cc4ff"/>
  <polygon points="1150,112 1136,105 1136,119" fill="#c084fc"/>
  <text x="340" y="146" fill="#7cc4ff" font-size="16.5" font-weight="700">the document's own hierarchy</text>
  <!-- visual: page headings -> same tree -->
  <g transform="translate(340,158)">
    <rect x="0" y="0" width="46" height="66" rx="4" fill="#101828" stroke="#3a4a6a"/>
    <rect x="7" y="8" width="26" height="5" rx="2" fill="#7cc4ff"/>
    <rect x="12" y="20" width="27" height="3" rx="1.5" fill="#5a6a8a"/>
    <rect x="12" y="28" width="27" height="3" rx="1.5" fill="#5a6a8a"/>
    <rect x="7" y="40" width="20" height="5" rx="2" fill="#7cc4ff"/>
    <rect x="12" y="52" width="27" height="3" rx="1.5" fill="#5a6a8a"/>
    <line x1="56" y1="33" x2="78" y2="33" stroke="#5a6a8a" stroke-width="2" marker-end="url(#arS)"/>
    <g stroke="#3a4a6a" stroke-width="1.4">
      <line x1="106" y1="16" x2="90" y2="36"/><line x1="106" y1="16" x2="122" y2="36"/><line x1="122" y1="48" x2="122" y2="58"/>
    </g>
    <rect x="99" y="4" width="14" height="13" rx="2" fill="#0f1525" stroke="#7cc4ff" stroke-width="1.6"/>
    <rect x="83" y="36" width="14" height="13" rx="2" fill="#0f1525" stroke="#7cc4ff" stroke-width="1.6"/>
    <rect x="115" y="36" width="14" height="13" rx="2" fill="#0f1525" stroke="#7cc4ff" stroke-width="1.6"/>
    <rect x="115" y="58" width="14" height="13" rx="2" fill="#0f1525" stroke="#7cc4ff" stroke-width="1.6"/>
    <text x="70" y="86" fill="#5a6a8a" font-size="11.5" text-anchor="middle">headings become the tree, as-is</text>
  </g>
  <text x="500" y="182" fill="#7ee787" font-size="13">+ free · faithful to the author</text>
  <text x="500" y="206" fill="#ff7b72" font-size="13">− only as good as its formatting</text>
  <text x="1150" y="146" fill="#c084fc" font-size="16.5" font-weight="700" text-anchor="end">machine-built (summaries · learned)</text>
  <!-- visual: chunks -> clustered -> generated summaries -->
  <g transform="translate(1010,158)">
    <g fill="#0f1525" stroke="#7cc4ff" stroke-width="1.4">
      <rect x="8" y="58" width="11" height="11" rx="1.5"/><rect x="26" y="58" width="11" height="11" rx="1.5"/>
      <rect x="86" y="58" width="11" height="11" rx="1.5"/><rect x="104" y="58" width="11" height="11" rx="1.5"/>
    </g>
    <rect x="2" y="52" width="42" height="23" rx="9" fill="none" stroke="#5a6a8a" stroke-dasharray="4 3"/>
    <rect x="80" y="52" width="42" height="23" rx="9" fill="none" stroke="#5a6a8a" stroke-dasharray="4 3"/>
    <g stroke="#3a4a6a" stroke-width="1.4">
      <line x1="23" y1="50" x2="26" y2="42"/><line x1="101" y1="50" x2="98" y2="42"/>
      <line x1="30" y1="26" x2="52" y2="14"/><line x1="94" y1="26" x2="72" y2="14"/>
    </g>
    <rect x="14" y="26" width="26" height="15" rx="7.5" fill="#0f1525" stroke="#c084fc" stroke-width="1.6"/>
    <rect x="84" y="26" width="26" height="15" rx="7.5" fill="#0f1525" stroke="#c084fc" stroke-width="1.6"/>
    <rect x="49" y="0" width="26" height="15" rx="7.5" fill="#0f1525" stroke="#c084fc" stroke-width="1.6"/>
    <text x="62" y="86" fill="#5a6a8a" font-size="11.5" text-anchor="middle">cluster + summarize (generated)</text>
  </g>
  <text x="990" y="182" fill="#7ee787" font-size="13" text-anchor="end">+ works on unstructured text</text>
  <text x="990" y="206" fill="#ff7b72" font-size="13" text-anchor="end">− generated: cost · can drift</text>

  <line x1="60" y1="262" x2="1140" y2="262" stroke="#1b2640"/>

  <!-- ===== row 2 : WALK axis ===== -->
  <g>
    <rect x="24" y="298" width="76" height="32" rx="8" fill="#101828" stroke="#3a4a6a"/>
    <text x="62" y="319" fill="#5a6a8a" font-size="14" text-anchor="middle">BUILD</text>
    <line x1="102" y1="314" x2="116" y2="314" stroke="#3a4a6a" stroke-width="2" marker-end="url(#arS)"/>
    <rect x="120" y="298" width="76" height="32" rx="8" fill="rgba(124,196,255,.16)" stroke="#7cc4ff" stroke-width="2"/>
    <text x="158" y="319" fill="#7cc4ff" font-size="14" font-weight="700" text-anchor="middle">TRAVERSE</text>
    <line x1="198" y1="314" x2="212" y2="314" stroke="#3a4a6a" stroke-width="2" marker-end="url(#arS)"/>
    <rect x="216" y="298" width="76" height="32" rx="8" fill="#101828" stroke="#3a4a6a"/>
    <text x="254" y="319" fill="#5a6a8a" font-size="14" text-anchor="middle">PACK</text>
    <text x="158" y="356" fill="#7cc4ff" font-size="13.5" text-anchor="middle">decided at TRAVERSE</text>
  </g>
  <text x="340" y="304" fill="#eef3fb" font-size="19" font-weight="700">Q2 · Who decides where to go next?</text>
  <text x="340" y="328" fill="#5a6a8a" font-size="13.5">at every fork someone must compare the branches with the question and choose</text>
  <line x1="352" y1="364" x2="1138" y2="364" stroke="#3a4a6a" stroke-width="2"/>
  <polygon points="340,364 354,357 354,371" fill="#7cc4ff"/>
  <polygon points="1150,364 1136,357 1136,371" fill="#c084fc"/>
  <text x="340" y="398" fill="#7cc4ff" font-size="16.5" font-weight="700">score-based traversal (word overlap · embeddings)</text>
  <!-- visual: a fork decided by numbers -->
  <g transform="translate(340,410)">
    <rect x="0" y="24" width="30" height="19" rx="9.5" fill="#2b2413" stroke="#ffc06b"/>
    <text x="15" y="37" fill="#ffc06b" font-size="11" text-anchor="middle" font-family="ui-monospace,monospace">q</text>
    <g stroke="#3a4a6a" stroke-width="1.4">
      <line x1="76" y1="18" x2="56" y2="56"/><line x1="84" y1="18" x2="104" y2="56"/>
    </g>
    <rect x="73" y="4" width="14" height="13" rx="2" fill="#0f1525" stroke="#7cc4ff" stroke-width="1.6"/>
    <rect x="49" y="56" width="14" height="13" rx="2" fill="#0f1525" stroke="#7cc4ff" stroke-width="1.6"/>
    <rect x="97" y="56" width="14" height="13" rx="2" fill="#0f1525" stroke="#7cc4ff" stroke-width="1.6"/>
    <text x="42" y="38" fill="#ffc06b" font-size="11.5" font-family="ui-monospace,monospace">0.92</text>
    <text x="106" y="38" fill="#5a6a8a" font-size="11.5" font-family="ui-monospace,monospace">0.15</text>
    <path d="M73 20 Q62 38 58 52" stroke="#ffc06b" stroke-width="2.2" fill="none" marker-end="url(#arA8)"/>
    <text x="80" y="86" fill="#5a6a8a" font-size="11.5" text-anchor="middle">the bigger number wins · no thinking</text>
  </g>
  <text x="500" y="434" fill="#7ee787" font-size="13">+ cheap · 0 LLM calls · scales</text>
  <text x="500" y="458" fill="#ff7b72" font-size="13">− matches only, cannot reason</text>
  <text x="1150" y="398" fill="#c084fc" font-size="16.5" font-weight="700" text-anchor="end">LLM-guided traversal (reads and reasons)</text>
  <!-- visual: a fork decided by an LLM -->
  <g transform="translate(1006,410)">
    <rect x="0" y="12" width="44" height="19" rx="9.5" fill="#2b1a2b" stroke="#ff8fd8"/>
    <text x="22" y="25" fill="#ff8fd8" font-size="10.5" text-anchor="middle" font-family="ui-monospace,monospace">LLM</text>
    <g stroke="#3a4a6a" stroke-width="1.4">
      <line x1="88" y1="18" x2="68" y2="56"/><line x1="96" y1="18" x2="116" y2="56"/>
    </g>
    <rect x="85" y="4" width="14" height="13" rx="2" fill="#0f1525" stroke="#7cc4ff" stroke-width="1.6"/>
    <rect x="61" y="56" width="14" height="13" rx="2" fill="#0f1525" stroke="#7cc4ff" stroke-width="1.6"/>
    <rect x="109" y="56" width="14" height="13" rx="2" fill="#0f1525" stroke="#7cc4ff" stroke-width="1.6"/>
    <line x1="42" y1="18" x2="62" y2="60" stroke="#ff8fd8" stroke-width="1.3" stroke-dasharray="3 3"/>
    <line x1="46" y1="16" x2="108" y2="60" stroke="#ff8fd8" stroke-width="1.3" stroke-dasharray="3 3"/>
    <path d="M44 26 Q56 44 62 54" stroke="#ff8fd8" stroke-width="2.2" fill="none" marker-end="url(#arP8)"/>
    <text x="66" y="86" fill="#5a6a8a" font-size="11.5" text-anchor="middle">reads both children, then chooses</text>
  </g>
  <text x="990" y="434" fill="#7ee787" font-size="13" text-anchor="end">+ reasons · follows references</text>
  <text x="990" y="458" fill="#ff7b72" font-size="13" text-anchor="end">− calls per query: slow, costly</text>

  <text x="600" y="540" fill="#eef3fb" font-size="17" text-anchor="middle">each method answers both questions → next slide places all seven on this <tspan fill="#ffc06b" font-weight="700">2×2 map</tspan></text>
</svg>

  </div>
  <div class="foot">08 / 32</div>
</div>
</body></html>
