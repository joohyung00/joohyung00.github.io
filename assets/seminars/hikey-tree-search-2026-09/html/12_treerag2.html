<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tree-search — TreeRAG: Retrieval Procedure</title>
<style>
  :root{
    --bg:#0a0e1a; --bg2:#0f1525; --panel:#161f35; --panel2:#1b2640;
    --ink:#eef3fb; --muted:#9aa7c5; --dim:#5a6a8a;
    --accent:#7cc4ff; --amber:#ffc06b; --ok:#7ee787; --warn:#ff7b72;
    --purple:#c084fc; --pink:#ff8fd8; --edge:#2a3a58; --code-bg:#050810;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(ellipse at top,var(--bg2) 0%,var(--bg) 60%) fixed,var(--bg);
    display:grid; place-items:center; min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",Roboto,sans-serif;
    color:var(--ink);
  }
  .slide{
    width:min(100vw,177.78vh); aspect-ratio:16/9;
    container-type:size; position:relative; overflow:hidden;
    background:linear-gradient(160deg,#0c1222 0%,#0a0e1a 100%);
    border:1px solid var(--edge);
    display:flex; flex-direction:column; padding:5.6cqw 6cqw 5cqw;
  }
  h1{ margin:0; font-weight:800; letter-spacing:-.05cqw; font-size:3.6cqw; line-height:1.08; padding-bottom:1.4cqw; border-bottom:1px solid var(--edge); }
  h1 .grad{ background:linear-gradient(135deg,var(--accent),var(--purple),var(--pink)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .body{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:1.4cqw; }
  .lead{ color:var(--muted); font-size:2.0cqw; margin:0; line-height:1.45; }
  p,li{ font-size:2.0cqw; line-height:1.45; margin:.4cqw 0; }
  ul{ margin:0; padding-left:2.4cqw; list-style:none; }
  ul li{ position:relative; margin:.7cqw 0; }
  ul li::before{ content:"–"; position:absolute; left:-2.2cqw; color:var(--purple); font-weight:700; }
  ul ul{ margin:.3cqw 0; }
  ul ul li{ font-size:1.7cqw; color:var(--muted); }
  ul ul li::before{ content:"·"; color:var(--dim); }
  .small{ font-size:1.55cqw; color:var(--muted); }
  b,strong{ color:#fff; }
  .accent{color:var(--accent);} .ok{color:var(--ok);} .warn{color:var(--warn);}
  .amber{color:var(--amber);} .purple{color:var(--purple);} .pink{color:var(--pink);} .dim{color:var(--dim);}
  .math{ font-family:"Cambria Math",Georgia,"Times New Roman",serif; }
  .slot{ font-family:"Cambria Math",Georgia,serif; color:var(--pink); }
  code{ font-family:ui-monospace,"JetBrains Mono",monospace; background:var(--panel); color:var(--amber); padding:.1cqw .6cqw; border-radius:.5cqw; border:1px solid var(--edge); font-size:.85em; }
  .card{ background:var(--panel); border:1px solid var(--edge); border-radius:1.1cqw; padding:1.4cqw 1.7cqw; }
  .two{ display:grid; grid-template-columns:1fr 1fr; gap:1.6cqw; }
  .three{ display:grid; grid-template-columns:repeat(3,1fr); gap:1.4cqw; }
  table{ width:100%; border-collapse:collapse; font-size:1.65cqw; }
  th,td{ border:1px solid var(--edge); padding:.7cqw 1cqw; text-align:left; vertical-align:middle; }
  th{ background:var(--bg2); color:var(--accent); font-weight:700; }
  .num{ text-align:right; font-family:ui-monospace,monospace; }
  .chip{ display:inline-block; padding:.35cqw 1.1cqw; border-radius:5cqw; font-size:1.4cqw; font-weight:700; border:1px solid var(--accent); color:var(--accent); background:rgba(124,196,255,.12); }
  .chip.ok{ border-color:var(--ok); color:var(--ok); background:rgba(126,231,135,.12); }
  .chip.warn{ border-color:var(--warn); color:var(--warn); background:rgba(255,123,114,.12); }
  .note{ background:rgba(124,196,255,.07); border-left:.4cqw solid var(--accent); padding:1cqw 1.5cqw; border-radius:0 .8cqw .8cqw 0; font-size:1.7cqw; }
  .callout{ background:linear-gradient(135deg,rgba(192,132,252,.10),rgba(124,196,255,.06)); border:1px solid var(--purple); border-radius:1.1cqw; padding:1.3cqw 1.7cqw; font-size:1.9cqw; }
  svg{ width:100%; height:auto; display:block; }
  .foot{ position:absolute; right:6cqw; bottom:2.6cqw; font-size:1.3cqw; color:var(--dim); font-family:ui-monospace,monospace; }
</style><style>
  .arcline{ display:flex; gap:.55cqw; align-items:center; font-size:1.18cqw; color:var(--dim);
            font-family:ui-monospace,monospace; flex-wrap:nowrap; }
  .arcline .st{ padding:.18cqw .75cqw; border:1px solid var(--edge); border-radius:5cqw; white-space:nowrap; }
  .arcline .st.cur{ border-color:var(--amber); color:var(--amber); background:rgba(255,192,107,.10); font-weight:700; }
  .arcline .sep{ color:var(--edge); }
</style></head>
<body>
<div class="slide">
  <h1>TreeRAG: Retrieval Procedure</h1>
  <div class="body">
<div class="arcline"><span class="st">① a tree, no traversal</span><span class="sep">→</span><span class="st cur">② score-based, both ways</span><span class="sep">→</span><span class="st">③ LLM-guided instead</span><span class="sep">→</span><span class="st">④ traversal learned</span><span class="sep">→</span><span class="st">⑤ multimodal</span></div>

<svg viewBox="0 0 1200 450">
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
    <path d="M0,0 L9,4.5 L0,9 z" fill="#9aa7c5"/></marker>
    <marker id="arP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
    <path d="M0,0 L9,4.5 L0,9 z" fill="#ff8fd8"/></marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
    <path d="M0,0 L9,4.5 L0,9 z" fill="#7ee787"/></marker></defs>
  <!-- 0 intent check -->
  <rect x="20" y="64" width="200" height="126" rx="14" fill="#131b30" stroke="#ff8fd8" stroke-width="2"/>
  <text x="120" y="94" fill="#ff8fd8" font-size="15" font-weight="700" text-anchor="middle">0 · intent check</text>
  <text x="120" y="116" fill="#5a6a8a" font-size="12" text-anchor="middle">LLM, once per query</text>
  <text x="120" y="144" fill="#9aa7c5" font-size="12.5" text-anchor="middle">"does it ask to list</text>
  <text x="120" y="162" fill="#9aa7c5" font-size="12.5" text-anchor="middle">or summarize?"</text>
  <line x1="224" y1="127" x2="258" y2="127" stroke="#9aa7c5" stroke-width="2.2" marker-end="url(#ar)"/>
  <text x="241" y="114" fill="#7ee787" font-size="12" text-anchor="middle">yes</text>
  <path d="M120 192 L120 404 L1046 404 L1046 362" stroke="#5a6a8a" stroke-width="1.6" stroke-dasharray="6 5" fill="none" marker-end="url(#ar)"/>
  <text x="580" y="396" fill="#5a6a8a" font-size="13" text-anchor="middle">no · skip the traversal entirely: the initial top-K chunks go straight to the reader</text>
  <!-- 1 initial retrieval -->
  <rect x="262" y="44" width="290" height="310" rx="14" fill="#131b30" stroke="#2a3a58"/>
  <text x="407" y="72" fill="#7cc4ff" font-size="15" font-weight="700" text-anchor="middle">1 · initial retrieval (top-K)</text>
  <g stroke="#2a3a58" stroke-width="1.4">
    <line x1="407" y1="116" x2="342" y2="158"/><line x1="407" y1="116" x2="472" y2="158"/>
    <line x1="342" y1="184" x2="310" y2="228"/><line x1="342" y1="184" x2="374" y2="228"/>
    <line x1="472" y1="184" x2="440" y2="228"/><line x1="472" y1="184" x2="504" y2="228"/>
  </g>
  <rect x="374" y="94" width="66" height="24" rx="8" fill="#101828" stroke="#3a4a6a"/><text x="407" y="110" fill="#5a6a8a" font-size="12" text-anchor="middle">root</text>
  <rect x="302" y="158" width="80" height="26" rx="8" fill="#1b2640" stroke="#c084fc"/><text x="342" y="176" fill="#c084fc" font-size="12.5" text-anchor="middle">§ A</text>
  <rect x="432" y="158" width="80" height="26" rx="8" fill="#1b2640" stroke="#c084fc"/><text x="472" y="176" fill="#c084fc" font-size="12.5" text-anchor="middle">§ B</text>
  <g font-size="11" text-anchor="middle">
    <rect x="280" y="228" width="60" height="24" rx="5" fill="#1b2640" stroke="#7cc4ff"/><text x="310" y="244" fill="#7cc4ff">chunk</text>
    <rect x="344" y="228" width="60" height="24" rx="5" fill="#1b2640" stroke="#7cc4ff"/><text x="374" y="244" fill="#7cc4ff">chunk</text>
    <rect x="410" y="228" width="60" height="24" rx="5" fill="#2b2413" stroke="#ffc06b" stroke-width="2"/><text x="440" y="244" fill="#ffc06b" font-weight="700">hit ★</text>
    <rect x="474" y="228" width="60" height="24" rx="5" fill="#1b2640" stroke="#7cc4ff"/><text x="504" y="244" fill="#7cc4ff">chunk</text>
  </g>
  <text x="407" y="298" fill="#9aa7c5" font-size="12" text-anchor="middle">embeddings hit leaf chunks</text>
  <text x="407" y="322" fill="#5a6a8a" font-size="11.5" text-anchor="middle">each chunk was embedded with its</text>
  <text x="407" y="338" fill="#5a6a8a" font-size="11.5" text-anchor="middle">ancestor-title prefix (from BUILD)</text>
  <line x1="556" y1="200" x2="588" y2="200" stroke="#9aa7c5" stroke-width="2.5" marker-end="url(#ar)"/>
  <!-- 2+3 up one hop, down to leaves -->
  <rect x="592" y="44" width="300" height="310" rx="14" fill="#131b30" stroke="#2a3a58"/>
  <text x="742" y="72" fill="#eef3fb" font-size="14.5" font-weight="700" text-anchor="middle"><tspan fill="#ff8fd8">2 · up one hop</tspan> <tspan fill="#5a6a8a">→</tspan> <tspan fill="#7ee787">3 · all its leaves</tspan></text>
  <g stroke="#2a3a58" stroke-width="1.4">
    <line x1="742" y1="116" x2="677" y2="158"/><line x1="742" y1="116" x2="807" y2="158"/>
    <line x1="677" y1="184" x2="645" y2="228"/><line x1="677" y1="184" x2="709" y2="228"/>
    <line x1="807" y1="184" x2="775" y2="228"/><line x1="807" y1="184" x2="839" y2="228"/>
  </g>
  <rect x="709" y="94" width="66" height="24" rx="8" fill="#101828" stroke="#3a4a6a"/><text x="742" y="110" fill="#5a6a8a" font-size="12" text-anchor="middle">root</text>
  <text x="782" y="128" fill="#ff7b72" font-size="14" font-weight="800">✗</text>
  <text x="800" y="128" fill="#5a6a8a" font-size="10.5">no higher</text>
  <rect x="637" y="158" width="80" height="26" rx="8" fill="#1b2640" stroke="#c084fc"/><text x="677" y="176" fill="#c084fc" font-size="12.5" text-anchor="middle">§ A</text>
  <rect x="767" y="158" width="80" height="26" rx="8" fill="rgba(126,231,135,.12)" stroke="#7ee787" stroke-width="2"/><text x="807" y="176" fill="#7ee787" font-size="12.5" font-weight="700" text-anchor="middle">§ B</text>
  <g font-size="11" text-anchor="middle">
    <rect x="615" y="228" width="60" height="24" rx="5" fill="#101828" stroke="#3a4a6a"/><text x="645" y="244" fill="#5a6a8a">chunk</text>
    <rect x="679" y="228" width="60" height="24" rx="5" fill="#101828" stroke="#3a4a6a"/><text x="709" y="244" fill="#5a6a8a">chunk</text>
    <rect x="745" y="228" width="60" height="24" rx="5" fill="#2b2413" stroke="#ffc06b" stroke-width="2"/><text x="775" y="244" fill="#ffc06b" font-weight="700">hit ★</text>
    <rect x="809" y="228" width="60" height="24" rx="5" fill="rgba(126,231,135,.12)" stroke="#7ee787" stroke-width="2"/><text x="839" y="244" fill="#7ee787" font-weight="700">sibling</text>
  </g>
  <path d="M785 226 Q798 206 803 188" stroke="#ff8fd8" stroke-width="2.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arP)"/>
  <path d="M796 188 Q782 208 778 224" stroke="#7ee787" stroke-width="2" fill="none" marker-end="url(#arG)"/>
  <path d="M818 188 Q832 208 836 224" stroke="#7ee787" stroke-width="2" fill="none" marker-end="url(#arG)"/>
  <text x="742" y="298" fill="#9aa7c5" font-size="12" text-anchor="middle">stops at the immediate parent</text>
  <text x="742" y="322" fill="#9aa7c5" font-size="12" text-anchor="middle">collects every leaf beneath it</text>
  <text x="742" y="342" fill="#5a6a8a" font-size="11.5" text-anchor="middle">repeated for each of the K hits · no iteration</text>
  <line x1="896" y1="200" x2="928" y2="200" stroke="#9aa7c5" stroke-width="2.5" marker-end="url(#ar)"/>
  <!-- 4 output -->
  <rect x="932" y="44" width="248" height="310" rx="14" fill="#131b30" stroke="#ffc06b" stroke-width="2"/>
  <text x="1056" y="72" fill="#ffc06b" font-size="15" font-weight="700" text-anchor="middle">4 · re-rank → final chunk set</text>
  <g font-size="12.5" text-anchor="middle">
    <rect x="952" y="92" width="208" height="34" rx="7" fill="#2b2413" stroke="#ffc06b"/><text x="1056" y="114" fill="#eef3fb">hit chunk ★</text>
    <rect x="952" y="136" width="208" height="34" rx="7" fill="rgba(126,231,135,.1)" stroke="#7ee787"/><text x="1056" y="158" fill="#7ee787">sibling chunk</text>
    <rect x="952" y="180" width="208" height="34" rx="7" fill="rgba(126,231,135,.1)" stroke="#7ee787"/><text x="1056" y="202" fill="#7ee787">sibling chunk</text>
  </g>
  <text x="1056" y="252" fill="#9aa7c5" font-size="12.5" text-anchor="middle">leaf chunks only, re-ranked</text>
  <text x="1056" y="276" fill="#5a6a8a" font-size="12" text-anchor="middle">parents · summaries never returned</text>
  <text x="1056" y="308" fill="#ffc06b" font-size="12.5" text-anchor="middle">→ handed to the reader</text>
  <!-- termination note -->
  <text x="600" y="440" fill="#eef3fb" font-size="14.5" text-anchor="middle">a single pass, no iteration: each hit gets <tspan fill="#ff8fd8">one hop up</tspan> + <tspan fill="#7ee787">one leaf expansion</tspan>, then re-rank and stop · nothing is revisited</text>
</svg>

  </div>
  <div class="foot">12 / 32</div>
</div>
</body></html>
