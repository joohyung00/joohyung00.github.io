<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tree-search — Searching by the Document Hierarchy</title>
<style>
  :root{
    --bg:#0a0e1a; --bg2:#0f1525; --panel:#161f35; --panel2:#1b2640;
    --ink:#eef3fb; --muted:#9aa7c5; --dim:#5a6a8a;
    --accent:#7cc4ff; --amber:#ffc06b; --ok:#7ee787; --warn:#ff7b72;
    --purple:#c084fc; --pink:#ff8fd8; --edge:#2a3a58; --code-bg:#050810;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(ellipse at top,var(--bg2) 0%,var(--bg) 60%) fixed,var(--bg);
    display:grid; place-items:center; min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",Roboto,sans-serif;
    color:var(--ink);
  }
  .slide{
    width:min(100vw,177.78vh); aspect-ratio:16/9;
    container-type:size; position:relative; overflow:hidden;
    background:linear-gradient(160deg,#0c1222 0%,#0a0e1a 100%);
    border:1px solid var(--edge);
    display:flex; flex-direction:column; padding:5.6cqw 6cqw 5cqw;
  }
  h1{ margin:0; font-weight:800; letter-spacing:-.05cqw; font-size:3.6cqw; line-height:1.08; padding-bottom:1.4cqw; border-bottom:1px solid var(--edge); }
  h1 .grad{ background:linear-gradient(135deg,var(--accent),var(--purple),var(--pink)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .body{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:1.4cqw; }
  .lead{ color:var(--muted); font-size:2.0cqw; margin:0; line-height:1.45; }
  p,li{ font-size:2.0cqw; line-height:1.45; margin:.4cqw 0; }
  ul{ margin:0; padding-left:2.4cqw; list-style:none; }
  ul li{ position:relative; margin:.7cqw 0; }
  ul li::before{ content:"–"; position:absolute; left:-2.2cqw; color:var(--purple); font-weight:700; }
  ul ul{ margin:.3cqw 0; }
  ul ul li{ font-size:1.7cqw; color:var(--muted); }
  ul ul li::before{ content:"·"; color:var(--dim); }
  .small{ font-size:1.55cqw; color:var(--muted); }
  b,strong{ color:#fff; }
  .accent{color:var(--accent);} .ok{color:var(--ok);} .warn{color:var(--warn);}
  .amber{color:var(--amber);} .purple{color:var(--purple);} .pink{color:var(--pink);} .dim{color:var(--dim);}
  .math{ font-family:"Cambria Math",Georgia,"Times New Roman",serif; }
  .slot{ font-family:"Cambria Math",Georgia,serif; color:var(--pink); }
  code{ font-family:ui-monospace,"JetBrains Mono",monospace; background:var(--panel); color:var(--amber); padding:.1cqw .6cqw; border-radius:.5cqw; border:1px solid var(--edge); font-size:.85em; }
  .card{ background:var(--panel); border:1px solid var(--edge); border-radius:1.1cqw; padding:1.4cqw 1.7cqw; }
  .two{ display:grid; grid-template-columns:1fr 1fr; gap:1.6cqw; }
  .three{ display:grid; grid-template-columns:repeat(3,1fr); gap:1.4cqw; }
  table{ width:100%; border-collapse:collapse; font-size:1.65cqw; }
  th,td{ border:1px solid var(--edge); padding:.7cqw 1cqw; text-align:left; vertical-align:middle; }
  th{ background:var(--bg2); color:var(--accent); font-weight:700; }
  .num{ text-align:right; font-family:ui-monospace,monospace; }
  .chip{ display:inline-block; padding:.35cqw 1.1cqw; border-radius:5cqw; font-size:1.4cqw; font-weight:700; border:1px solid var(--accent); color:var(--accent); background:rgba(124,196,255,.12); }
  .chip.ok{ border-color:var(--ok); color:var(--ok); background:rgba(126,231,135,.12); }
  .chip.warn{ border-color:var(--warn); color:var(--warn); background:rgba(255,123,114,.12); }
  .note{ background:rgba(124,196,255,.07); border-left:.4cqw solid var(--accent); padding:1cqw 1.5cqw; border-radius:0 .8cqw .8cqw 0; font-size:1.7cqw; }
  .callout{ background:linear-gradient(135deg,rgba(192,132,252,.10),rgba(124,196,255,.06)); border:1px solid var(--purple); border-radius:1.1cqw; padding:1.3cqw 1.7cqw; font-size:1.9cqw; }
  svg{ width:100%; height:auto; display:block; }
  .foot{ position:absolute; right:6cqw; bottom:2.6cqw; font-size:1.3cqw; color:var(--dim); font-family:ui-monospace,monospace; }
</style></head>
<body>
<div class="slide">
  <h1>Searching by the Document Hierarchy</h1>
  <div class="body">

<svg viewBox="0 0 1200 400">
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
    <path d="M0,0 L9,4.5 L0,9 z" fill="#ffc06b"/></marker></defs>
  <!-- left: human -->
  <rect x="20" y="30" width="520" height="340" rx="14" fill="#131b30" stroke="#2a3a58"/>
  <text x="280" y="62" fill="#9aa7c5" font-size="17" text-anchor="middle">how a person searches</text>
  <g font-size="17">
    <text x="52" y="104" fill="#eef3fb">Table of Contents</text>
    <text x="80" y="140" fill="#5a6a8a">1. Introduction</text>
    <text x="80" y="174" fill="#5a6a8a">2. Safety Precautions</text>
    <text x="80" y="208" fill="#5a6a8a">3. Installation</text>
    <text x="80" y="242" fill="#5a6a8a">4. Usage</text>
    <text x="80" y="276" fill="#eef3fb" font-weight="700">5. Maintenance  ←</text>
    <text x="110" y="310" fill="#eef3fb" font-weight="700">5.3 Battery  ←</text>
    <text x="140" y="344" fill="#ffc06b" font-weight="700">Table: intervals  ← arrival</text>
  </g>
  <path d="M330 270 Q360 290 350 302" stroke="#ffc06b" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M360 304 Q390 324 380 336" stroke="#ffc06b" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <text x="420" y="130" fill="#9aa7c5" font-size="15">reads only headings,</text>
  <text x="420" y="152" fill="#9aa7c5" font-size="15">rules out whole branches</text>
  <!-- middle equal -->
  <text x="588" y="210" fill="#5a6a8a" font-size="40" text-anchor="middle">=</text>
  <!-- right: tree -->
  <rect x="640" y="30" width="540" height="340" rx="14" fill="#131b30" stroke="#2a3a58"/>
  <text x="910" y="62" fill="#9aa7c5" font-size="17" text-anchor="middle">the same strategy, mechanized: tree traversal</text>
  <g stroke="#2a3a58" stroke-width="1.5">
    <line x1="910" y1="106" x2="790" y2="170"/><line x1="910" y1="106" x2="910" y2="170"/><line x1="910" y1="106" x2="1030" y2="170"/>
    <line x1="1030" y1="196" x2="970" y2="260"/><line x1="1030" y1="196" x2="1090" y2="260"/>
    <line x1="1090" y1="286" x2="1090" y2="316"/>
  </g>
  <rect x="866" y="84" width="88" height="30" rx="9" fill="#1b2640" stroke="#c084fc"/><text x="910" y="104" fill="#c084fc" font-size="14" text-anchor="middle">X100</text>
  <g font-size="13" text-anchor="middle">
    <rect x="748" y="170" width="84" height="28" rx="8" fill="#101828" stroke="#3a4a6a"/><text x="790" y="189" fill="#5a6a8a">2. Safety</text>
    <rect x="868" y="170" width="84" height="28" rx="8" fill="#101828" stroke="#3a4a6a"/><text x="910" y="189" fill="#5a6a8a">4. Usage</text>
    <rect x="988" y="170" width="84" height="28" rx="8" fill="#1b2640" stroke="#c084fc" stroke-width="2"/><text x="1030" y="189" fill="#eef3fb" font-weight="700">5. Maint.</text>
    <rect x="928" y="260" width="84" height="28" rx="8" fill="#101828" stroke="#3a4a6a"/><text x="970" y="279" fill="#5a6a8a">5.1 Clean</text>
    <rect x="1048" y="260" width="84" height="28" rx="8" fill="#1b2640" stroke="#c084fc" stroke-width="2"/><text x="1090" y="279" fill="#eef3fb" font-weight="700">5.3 Battery</text>
    <rect x="1048" y="316" width="84" height="28" rx="5" fill="#2b2413" stroke="#ffc06b" stroke-width="2"/><text x="1090" y="335" fill="#ffc06b" font-weight="700">Table ✓</text>
  </g>
  <text x="790" y="228" fill="#5a6a8a" font-size="13" text-anchor="middle">not opened = never read</text>
  <path d="M930 116 Q990 140 1016 166" stroke="#ffc06b" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M1044 200 Q1070 226 1082 254" stroke="#ffc06b" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M1090 290 Q1090 300 1090 310" stroke="#ffc06b" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
</svg>
<ul>
  <li><b>Choose branches from headings and summaries alone</b> · reading shrinks sharply</li>
  <li>A ToC is just the document's <b>hierarchy</b> · tree-based search = this strategy, mechanized</li>
</ul>

  </div>
  <div class="foot">05 / 32</div>
</div>
</body></html>
