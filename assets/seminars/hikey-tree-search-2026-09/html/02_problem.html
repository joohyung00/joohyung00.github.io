<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tree-search — Question Answering over a Document Collection</title>
<style>
  :root{
    --bg:#0a0e1a; --bg2:#0f1525; --panel:#161f35; --panel2:#1b2640;
    --ink:#eef3fb; --muted:#9aa7c5; --dim:#5a6a8a;
    --accent:#7cc4ff; --amber:#ffc06b; --ok:#7ee787; --warn:#ff7b72;
    --purple:#c084fc; --pink:#ff8fd8; --edge:#2a3a58; --code-bg:#050810;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(ellipse at top,var(--bg2) 0%,var(--bg) 60%) fixed,var(--bg);
    display:grid; place-items:center; min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",Roboto,sans-serif;
    color:var(--ink);
  }
  .slide{
    width:min(100vw,177.78vh); aspect-ratio:16/9;
    container-type:size; position:relative; overflow:hidden;
    background:linear-gradient(160deg,#0c1222 0%,#0a0e1a 100%);
    border:1px solid var(--edge);
    display:flex; flex-direction:column; padding:5.6cqw 6cqw 5cqw;
  }
  h1{ margin:0; font-weight:800; letter-spacing:-.05cqw; font-size:3.6cqw; line-height:1.08; padding-bottom:1.4cqw; border-bottom:1px solid var(--edge); }
  h1 .grad{ background:linear-gradient(135deg,var(--accent),var(--purple),var(--pink)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .body{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:1.4cqw; }
  .lead{ color:var(--muted); font-size:2.0cqw; margin:0; line-height:1.45; }
  p,li{ font-size:2.0cqw; line-height:1.45; margin:.4cqw 0; }
  ul{ margin:0; padding-left:2.4cqw; list-style:none; }
  ul li{ position:relative; margin:.7cqw 0; }
  ul li::before{ content:"–"; position:absolute; left:-2.2cqw; color:var(--purple); font-weight:700; }
  ul ul{ margin:.3cqw 0; }
  ul ul li{ font-size:1.7cqw; color:var(--muted); }
  ul ul li::before{ content:"·"; color:var(--dim); }
  .small{ font-size:1.55cqw; color:var(--muted); }
  b,strong{ color:#fff; }
  .accent{color:var(--accent);} .ok{color:var(--ok);} .warn{color:var(--warn);}
  .amber{color:var(--amber);} .purple{color:var(--purple);} .pink{color:var(--pink);} .dim{color:var(--dim);}
  .math{ font-family:"Cambria Math",Georgia,"Times New Roman",serif; }
  .slot{ font-family:"Cambria Math",Georgia,serif; color:var(--pink); }
  code{ font-family:ui-monospace,"JetBrains Mono",monospace; background:var(--panel); color:var(--amber); padding:.1cqw .6cqw; border-radius:.5cqw; border:1px solid var(--edge); font-size:.85em; }
  .card{ background:var(--panel); border:1px solid var(--edge); border-radius:1.1cqw; padding:1.4cqw 1.7cqw; }
  .two{ display:grid; grid-template-columns:1fr 1fr; gap:1.6cqw; }
  .three{ display:grid; grid-template-columns:repeat(3,1fr); gap:1.4cqw; }
  table{ width:100%; border-collapse:collapse; font-size:1.65cqw; }
  th,td{ border:1px solid var(--edge); padding:.7cqw 1cqw; text-align:left; vertical-align:middle; }
  th{ background:var(--bg2); color:var(--accent); font-weight:700; }
  .num{ text-align:right; font-family:ui-monospace,monospace; }
  .chip{ display:inline-block; padding:.35cqw 1.1cqw; border-radius:5cqw; font-size:1.4cqw; font-weight:700; border:1px solid var(--accent); color:var(--accent); background:rgba(124,196,255,.12); }
  .chip.ok{ border-color:var(--ok); color:var(--ok); background:rgba(126,231,135,.12); }
  .chip.warn{ border-color:var(--warn); color:var(--warn); background:rgba(255,123,114,.12); }
  .note{ background:rgba(124,196,255,.07); border-left:.4cqw solid var(--accent); padding:1cqw 1.5cqw; border-radius:0 .8cqw .8cqw 0; font-size:1.7cqw; }
  .callout{ background:linear-gradient(135deg,rgba(192,132,252,.10),rgba(124,196,255,.06)); border:1px solid var(--purple); border-radius:1.1cqw; padding:1.3cqw 1.7cqw; font-size:1.9cqw; }
  svg{ width:100%; height:auto; display:block; }
  .foot{ position:absolute; right:6cqw; bottom:2.6cqw; font-size:1.3cqw; color:var(--dim); font-family:ui-monospace,monospace; }
</style></head>
<body>
<div class="slide">
  <h1>Question Answering over a Document Collection</h1>
  <div class="body">

<svg viewBox="0 0 1200 400">
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
    <path d="M0,0 L9,4.5 L0,9 z" fill="#9aa7c5"/></marker>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ffc06b" flood-opacity="0.85"/></filter>
  </defs>
  <!-- question -->
  <rect x="20" y="140" width="300" height="110" rx="14" fill="#2b2413" stroke="#ffc06b" stroke-width="2"/>
  <text x="40" y="176" fill="#ffc06b" font-size="19" font-weight="700">Q.</text>
  <text x="40" y="204" fill="#eef3fb" font-size="19">How often should the battery</text>
  <text x="40" y="230" fill="#eef3fb" font-size="19">of model X100 be inspected?</text>
  <line x1="326" y1="195" x2="392" y2="195" stroke="#9aa7c5" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="358" y="180" fill="#9aa7c5" font-size="15" text-anchor="middle">what to read?</text>
  <!-- corpus -->
  <g>
    <text x="540" y="52" fill="#9aa7c5" font-size="17" text-anchor="middle">hundreds of product manuals</text>
    <g font-size="12.5" fill="#5a6a8a" text-anchor="middle">
      <rect x="400" y="70" width="88" height="58" rx="7" fill="#131b30" stroke="#2a3a58"/><text x="444" y="103">Install Guide</text>
      <rect x="498" y="70" width="88" height="58" rx="7" fill="#131b30" stroke="#2a3a58"/><text x="542" y="103">X200 Manual</text>
      <rect x="596" y="70" width="88" height="58" rx="7" fill="#131b30" stroke="#2a3a58"/><text x="640" y="103">Warranty</text>
      <rect x="400" y="140" width="88" height="58" rx="7" fill="#131b30" stroke="#2a3a58"/><text x="444" y="173">X300 Manual</text>
      <rect x="596" y="140" width="88" height="58" rx="7" fill="#131b30" stroke="#2a3a58"/><text x="640" y="173">Service Guide</text>
      <rect x="400" y="210" width="88" height="58" rx="7" fill="#131b30" stroke="#2a3a58"/><text x="444" y="243">Parts List</text>
      <rect x="498" y="210" width="88" height="58" rx="7" fill="#131b30" stroke="#2a3a58"/><text x="542" y="243">Safety Rules</text>
      <rect x="596" y="210" width="88" height="58" rx="7" fill="#131b30" stroke="#2a3a58"/><text x="640" y="243">FAQ</text>
    </g>
    <rect x="498" y="140" width="88" height="58" rx="7" fill="#1d2438" stroke="#ffc06b" stroke-width="2.5" filter="url(#glow)"/>
    <text x="542" y="173" fill="#ffc06b" font-size="12.5" font-weight="700" text-anchor="middle">X100 Manual</text>
    <text x="542" y="296" fill="#5a6a8a" font-size="14" text-anchor="middle">… × hundreds</text>
  </g>
  <line x1="592" y1="170" x2="742" y2="170" stroke="#ffc06b" stroke-width="2.5" marker-end="url(#ar)"/>
  <!-- zoom: inside the manual -->
  <rect x="750" y="42" width="430" height="316" rx="14" fill="#131b30" stroke="#2a3a58"/>
  <text x="770" y="74" fill="#9aa7c5" font-size="16">Inside the X100 manual: the path to the answer</text>
  <g font-size="16">
    <text x="770" y="112" fill="#eef3fb">📕 X100 User Manual</text>
    <text x="800" y="146" fill="#9aa7c5">└ 5. Maintenance</text>
    <text x="830" y="180" fill="#9aa7c5">└ 5.3 Battery</text>
    <text x="860" y="214" fill="#7cc4ff">└ Table: inspection intervals</text>
  </g>
  <rect x="860" y="232" width="290" height="76" rx="8" fill="#0f1525" stroke="#2a3a58"/>
  <line x1="860" y1="258" x2="1150" y2="258" stroke="#2a3a58"/>
  <line x1="1010" y1="232" x2="1010" y2="308" stroke="#2a3a58"/>
  <text x="875" y="250" fill="#5a6a8a" font-size="13.5">part</text>
  <text x="1025" y="250" fill="#5a6a8a" font-size="13.5">interval</text>
  <text x="875" y="280" fill="#9aa7c5" font-size="14">cooling fan</text><text x="1025" y="280" fill="#9aa7c5" font-size="14">12 months</text>
  <rect x="1012" y="286" width="136" height="20" rx="4" fill="rgba(255,192,107,.2)" stroke="#ffc06b"/>
  <text x="875" y="301" fill="#eef3fb" font-size="14" font-weight="700">battery</text><text x="1025" y="301" fill="#ffc06b" font-size="14" font-weight="700">6 months</text>
  <text x="965" y="344" fill="#5a6a8a" font-size="14" text-anchor="middle">answer = one document → one section → one table cell</text>
</svg>
<ul>
  <li><b>Goal</b> · find the evidence in a document pile and answer · this example recurs through the deck</li>
</ul>

  </div>
  <div class="foot">02 / 32</div>
</div>
</body></html>
