<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tree-search — RDR2: Routing over Document Structure</title>
<style>
  :root{
    --bg:#0a0e1a; --bg2:#0f1525; --panel:#161f35; --panel2:#1b2640;
    --ink:#eef3fb; --muted:#9aa7c5; --dim:#5a6a8a;
    --accent:#7cc4ff; --amber:#ffc06b; --ok:#7ee787; --warn:#ff7b72;
    --purple:#c084fc; --pink:#ff8fd8; --edge:#2a3a58; --code-bg:#050810;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(ellipse at top,var(--bg2) 0%,var(--bg) 60%) fixed,var(--bg);
    display:grid; place-items:center; min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",Roboto,sans-serif;
    color:var(--ink);
  }
  .slide{
    width:min(100vw,177.78vh); aspect-ratio:16/9;
    container-type:size; position:relative; overflow:hidden;
    background:linear-gradient(160deg,#0c1222 0%,#0a0e1a 100%);
    border:1px solid var(--edge);
    display:flex; flex-direction:column; padding:5.6cqw 6cqw 5cqw;
  }
  h1{ margin:0; font-weight:800; letter-spacing:-.05cqw; font-size:3.6cqw; line-height:1.08; padding-bottom:1.4cqw; border-bottom:1px solid var(--edge); }
  h1 .grad{ background:linear-gradient(135deg,var(--accent),var(--purple),var(--pink)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .body{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:1.4cqw; }
  .lead{ color:var(--muted); font-size:2.0cqw; margin:0; line-height:1.45; }
  p,li{ font-size:2.0cqw; line-height:1.45; margin:.4cqw 0; }
  ul{ margin:0; padding-left:2.4cqw; list-style:none; }
  ul li{ position:relative; margin:.7cqw 0; }
  ul li::before{ content:"–"; position:absolute; left:-2.2cqw; color:var(--purple); font-weight:700; }
  ul ul{ margin:.3cqw 0; }
  ul ul li{ font-size:1.7cqw; color:var(--muted); }
  ul ul li::before{ content:"·"; color:var(--dim); }
  .small{ font-size:1.55cqw; color:var(--muted); }
  b,strong{ color:#fff; }
  .accent{color:var(--accent);} .ok{color:var(--ok);} .warn{color:var(--warn);}
  .amber{color:var(--amber);} .purple{color:var(--purple);} .pink{color:var(--pink);} .dim{color:var(--dim);}
  .math{ font-family:"Cambria Math",Georgia,"Times New Roman",serif; }
  .slot{ font-family:"Cambria Math",Georgia,serif; color:var(--pink); }
  code{ font-family:ui-monospace,"JetBrains Mono",monospace; background:var(--panel); color:var(--amber); padding:.1cqw .6cqw; border-radius:.5cqw; border:1px solid var(--edge); font-size:.85em; }
  .card{ background:var(--panel); border:1px solid var(--edge); border-radius:1.1cqw; padding:1.4cqw 1.7cqw; }
  .two{ display:grid; grid-template-columns:1fr 1fr; gap:1.6cqw; }
  .three{ display:grid; grid-template-columns:repeat(3,1fr); gap:1.4cqw; }
  table{ width:100%; border-collapse:collapse; font-size:1.65cqw; }
  th,td{ border:1px solid var(--edge); padding:.7cqw 1cqw; text-align:left; vertical-align:middle; }
  th{ background:var(--bg2); color:var(--accent); font-weight:700; }
  .num{ text-align:right; font-family:ui-monospace,monospace; }
  .chip{ display:inline-block; padding:.35cqw 1.1cqw; border-radius:5cqw; font-size:1.4cqw; font-weight:700; border:1px solid var(--accent); color:var(--accent); background:rgba(124,196,255,.12); }
  .chip.ok{ border-color:var(--ok); color:var(--ok); background:rgba(126,231,135,.12); }
  .chip.warn{ border-color:var(--warn); color:var(--warn); background:rgba(255,123,114,.12); }
  .note{ background:rgba(124,196,255,.07); border-left:.4cqw solid var(--accent); padding:1cqw 1.5cqw; border-radius:0 .8cqw .8cqw 0; font-size:1.7cqw; }
  .callout{ background:linear-gradient(135deg,rgba(192,132,252,.10),rgba(124,196,255,.06)); border:1px solid var(--purple); border-radius:1.1cqw; padding:1.3cqw 1.7cqw; font-size:1.9cqw; }
  svg{ width:100%; height:auto; display:block; }
  .foot{ position:absolute; right:6cqw; bottom:2.6cqw; font-size:1.3cqw; color:var(--dim); font-family:ui-monospace,monospace; }
</style><style>
  .arcline{ display:flex; gap:.55cqw; align-items:center; font-size:1.18cqw; color:var(--dim);
            font-family:ui-monospace,monospace; flex-wrap:nowrap; }
  .arcline .st{ padding:.18cqw .75cqw; border:1px solid var(--edge); border-radius:5cqw; white-space:nowrap; }
  .arcline .st.cur{ border-color:var(--amber); color:var(--amber); background:rgba(255,192,107,.10); font-weight:700; }
  .arcline .sep{ color:var(--edge); }
</style></head>
<body>
<div class="slide">
  <h1>RDR2: Routing over Document Structure</h1>
  <div class="body">
<div class="arcline"><span class="st">① a tree, no traversal</span><span class="sep">→</span><span class="st">② score-based, both ways</span><span class="sep">→</span><span class="st">③ LLM-guided instead</span><span class="sep">→</span><span class="st cur">④ traversal learned</span><span class="sep">→</span><span class="st">⑤ multimodal</span></div>

<svg viewBox="0 0 1200 470">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#9aa7c5"/></marker>
    <marker id="arA" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#ffc06b"/></marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#7ee787"/></marker>
  </defs>

  <!-- pipeline -->
  <g font-size="11.5">
    <rect x="286" y="14" width="132" height="28" rx="8" fill="#1b2640" stroke="#3a4a6a"/>
    <text x="352" y="33" fill="#9aa7c5" text-anchor="middle">Retrieve top-k</text>
    <line x1="422" y1="28" x2="438" y2="28" stroke="#9aa7c5" stroke-width="1.6" marker-end="url(#ar)"/>
    <rect x="442" y="14" width="152" height="28" rx="8" fill="rgba(255,192,107,.12)" stroke="#ffc06b" stroke-width="2"/>
    <text x="518" y="33" fill="#ffc06b" font-weight="700" text-anchor="middle">DocumentRoute</text>
    <line x1="598" y1="28" x2="614" y2="28" stroke="#9aa7c5" stroke-width="1.6" marker-end="url(#ar)"/>
    <rect x="618" y="14" width="112" height="28" rx="8" fill="#1b2640" stroke="#3a4a6a"/>
    <text x="674" y="33" fill="#9aa7c5" text-anchor="middle">Read</text>
    <text x="746" y="33" fill="#5a6a8a" font-size="10">one document at a time, in a loop</text>
  </g>

  <!-- ============ BEFORE ============ -->
  <text x="215" y="66" fill="#9aa7c5" font-size="13" font-weight="700" text-anchor="middle">the document tree as it stands now</text>
  <rect x="20" y="76" width="390" height="304" rx="14" fill="#131b30" stroke="#2a3a58"/>
  <g font-family="ui-monospace,monospace" font-size="11">
    <text x="40" y="112" fill="#c084fc">0: =Wonder Woman in other media=</text>
    <text x="56" y="138" fill="#c084fc">2: ==Live action==</text>
    <path d="M60 158 l0,9 l7,-4.5 z" fill="#5a6a8a" transform="rotate(90 63.5 162.5)"/>
    <text x="74" y="166" fill="#ffc06b">3: ===Theatrical releases===</text>
    <rect x="92" y="176" width="286" height="24" rx="5" fill="rgba(124,196,255,.1)" stroke="#7cc4ff"/>
    <text x="100" y="192" fill="#7cc4ff">4: Gal Gadot portrays Diana…</text>
    <path d="M60 210 l0,9 l7,-4.5 z" fill="#5a6a8a"/>
    <text x="74" y="220" fill="#5a6a8a">5: ===Television===</text>
    <path d="M44 240 l0,9 l7,-4.5 z" fill="#5a6a8a"/>
    <text x="58" y="250" fill="#5a6a8a">8: ==Animation==</text>
    <path d="M44 270 l0,9 l7,-4.5 z" fill="#5a6a8a"/>
    <text x="58" y="280" fill="#5a6a8a">10: ==Video games==</text>
  </g>
  <text x="215" y="318" fill="#9aa7c5" font-size="10.5" text-anchor="middle">every heading is always there · only passages open and close</text>
  <text x="215" y="338" fill="#5a6a8a" font-size="10.5" text-anchor="middle">open now: the passage retrieval landed on, plus its siblings</text>
  <text x="215" y="362" fill="#5a6a8a" font-size="10" text-anchor="middle">▸ collapsed heading    ▾ opened heading</text>
  <line x1="414" y1="220" x2="428" y2="220" stroke="#9aa7c5" stroke-width="2.4" marker-end="url(#ar)"/>

  <!-- ============ ROUTER ============ -->
  <text x="600" y="66" fill="#ff8fd8" font-size="13" font-weight="700" text-anchor="middle">one step of the router</text>
  <rect x="432" y="76" width="336" height="304" rx="14" fill="#131b30" stroke="#ff8fd8" stroke-width="2"/>
  <rect x="450" y="92" width="300" height="26" rx="8" fill="rgba(255,192,107,.1)" stroke="#ffc06b" stroke-width="1.6"/>
  <text x="600" y="110" fill="#ffc06b" font-size="11" font-weight="700" text-anchor="middle">★ the router is the only trained part</text>
  <text x="600" y="136" fill="#9aa7c5" font-size="10.5" text-anchor="middle">reads the question + the tree on the left</text>
  <g font-size="11" font-family="ui-monospace,monospace">
    <rect x="450" y="150" width="80" height="24" rx="5" fill="rgba(192,132,252,.14)" stroke="#c084fc"/>
    <text x="490" y="166" fill="#c084fc" text-anchor="middle">[EXP] 5</text>
    <text x="542" y="160" fill="#eef3fb" font-size="10.5">open heading 5,</text>
    <text x="542" y="174" fill="#9aa7c5" font-size="10.5">close what was open</text>
    <text x="756" y="167" fill="#c084fc" font-size="9" font-weight="700" letter-spacing="1.6" text-anchor="end">EXPLORE</text>
    <rect x="450" y="192" width="80" height="24" rx="5" fill="rgba(126,231,135,.14)" stroke="#7ee787"/>
    <text x="490" y="208" fill="#7ee787" text-anchor="middle">[ANS] 4</text>
    <text x="542" y="202" fill="#eef3fb" font-size="10.5">take passage 4 out,</text>
    <text x="542" y="216" fill="#9aa7c5" font-size="10.5">the tree is untouched</text>
    <text x="756" y="209" fill="#7ee787" font-size="9" font-weight="700" letter-spacing="1.6" text-anchor="end">HARVEST</text>
    <rect x="450" y="234" width="80" height="24" rx="5" fill="rgba(255,123,114,.08)" stroke="#ff7b72" stroke-opacity=".5"/>
    <text x="490" y="250" fill="#ff7b72" fill-opacity=".6" text-anchor="middle">[REF] −1</text>
    <text x="542" y="244" fill="#5a6a8a" font-size="10.5">not chosen this step —</text>
    <text x="542" y="258" fill="#5a6a8a" font-size="10.5">would end this document</text>
    <text x="756" y="251" fill="#ff7b72" fill-opacity=".7" font-size="9" font-weight="700" letter-spacing="1.6" text-anchor="end">STOP</text>
  </g>
  <text x="600" y="288" fill="#5a6a8a" font-size="10.5" text-anchor="middle">an action is ⟨tag, node id⟩ · several per step</text>
  <text x="600" y="312" fill="#c084fc" font-size="10.5" text-anchor="middle">only [EXP] rewrites the tree →</text>
  <text x="600" y="334" fill="#7ee787" font-size="10.5" text-anchor="middle">only [ANS] writes to the pile below ↓</text>
  <line x1="772" y1="220" x2="786" y2="220" stroke="#c084fc" stroke-width="2.4" marker-end="url(#ar)"/>

  <!-- ============ AFTER ============ -->
  <text x="985" y="66" fill="#c084fc" font-size="13" font-weight="700" text-anchor="middle">after [EXP] 5 · the same tree, rewritten</text>
  <rect x="790" y="76" width="390" height="304" rx="14" fill="#131b30" stroke="#c084fc" stroke-width="2"/>
  <g font-family="ui-monospace,monospace" font-size="11">
    <text x="810" y="112" fill="#c084fc">0: =Wonder Woman in other media=</text>
    <text x="826" y="138" fill="#c084fc">2: ==Live action==</text>
    <path d="M830 158 l0,9 l7,-4.5 z" fill="#5a6a8a"/>
    <text x="844" y="166" fill="#5a6a8a">3: ===Theatrical releases===</text>
    <text x="1084" y="166" fill="#ff7b72" font-size="9.5">← closed</text>
    <path d="M830 186 l0,9 l7,-4.5 z" fill="#ffc06b" transform="rotate(90 833.5 190.5)"/>
    <text x="844" y="194" fill="#ffc06b">5: ===Television===</text>
    <text x="1084" y="194" fill="#7ee787" font-size="9.5">← opened</text>
    <rect x="862" y="204" width="286" height="24" rx="5" fill="rgba(126,231,135,.1)" stroke="#7ee787"/>
    <text x="870" y="220" fill="#7ee787">6: Cathy Lee Crosby portrays…</text>
    <rect x="862" y="232" width="286" height="24" rx="5" fill="rgba(126,231,135,.1)" stroke="#7ee787"/>
    <text x="870" y="248" fill="#7ee787">7: Lynda Carter portrays…</text>
    <path d="M814 268 l0,9 l7,-4.5 z" fill="#5a6a8a"/>
    <text x="828" y="278" fill="#5a6a8a">8: ==Animation==</text>
    <path d="M814 292 l0,9 l7,-4.5 z" fill="#5a6a8a"/>
    <text x="828" y="302" fill="#5a6a8a">10: ==Video games==</text>
  </g>
  <text x="985" y="334" fill="#eef3fb" font-size="10.5" text-anchor="middle">identical headings · one window of text swapped for another</text>
  <text x="985" y="356" fill="#5a6a8a" font-size="10.5" text-anchor="middle">the tree never grows, so the prompt stays a fixed size</text>

  <!-- ============ what [ANS] harvests, and where it ends up ============ -->
  <path d="M480 344 L480 404" stroke="#7ee787" stroke-width="1.8" fill="none" marker-end="url(#arG)"/>
  <rect x="20" y="396" width="880" height="60" rx="12" fill="#0f1525" stroke="#7ee787"/>
  <text x="38" y="418" fill="#7ee787" font-size="11" font-weight="700">kept passages</text>
  <text x="38" y="436" fill="#5a6a8a" font-size="9.5">outside the tree</text>
  <text x="168" y="421" fill="#9aa7c5" font-size="10">what [ANS] pulls out of the tree,</text>
  <text x="168" y="437" fill="#5a6a8a" font-size="10">step after step — the tree never holds it</text>
  <rect x="440" y="412" width="190" height="28" rx="7" fill="rgba(126,231,135,.1)" stroke="#7ee787"/>
  <text x="450" y="431" fill="#7ee787" font-size="10.5" font-family="ui-monospace,monospace">4: Gal Gadot portrays…</text>
  <rect x="638" y="412" width="122" height="28" rx="7" fill="#0a0e1a" stroke="#3a4a6a" stroke-dasharray="4 3"/>
  <text x="648" y="431" fill="#5a6a8a" font-size="10.5" font-family="ui-monospace,monospace">6, 7 next</text>
  <text x="772" y="431" fill="#5a6a8a" font-size="10">grows until [REF]</text>
  <line x1="906" y1="426" x2="926" y2="426" stroke="#7ee787" stroke-width="2" marker-end="url(#arG)"/>
  <rect x="930" y="408" width="130" height="36" rx="10" fill="#2b1a2b" stroke="#ff8fd8" stroke-width="2"/>
  <text x="995" y="424" fill="#ff8fd8" font-size="11.5" font-weight="700" text-anchor="middle">Reader</text>
  <text x="995" y="438" fill="#9aa7c5" font-size="9" text-anchor="middle">one call · q + every pile</text>
  <line x1="1064" y1="426" x2="1084" y2="426" stroke="#ff8fd8" stroke-width="2" marker-end="url(#ar)"/>
  <text x="1092" y="430" fill="#eef3fb" font-size="11.5">answer</text>
</svg>

  </div>
  <div class="foot">16 / 32</div>
</div>
</body></html>
