<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory OS of AI Agent</title>
<style>
  :root{
    --bg:#0a0e1a; --bg2:#0f1525; --panel:#161f35; --panel2:#1b2640;
    --ink:#eef3fb; --muted:#9aa7c5; --dim:#5a6a8a;
    --accent:#7cc4ff; --amber:#ffc06b; --ok:#7ee787; --warn:#ff7b72;
    --purple:#c084fc; --pink:#ff8fd8; --edge:#2a3a58; --code-bg:#050810;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(ellipse at top,var(--bg2) 0%,var(--bg) 60%) fixed,var(--bg);
    display:grid; place-items:center; min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",Roboto,sans-serif;
    color:var(--ink);
  }
  .slide{
    width:min(100vw,177.78vh); aspect-ratio:16/9;
    container-type:size; position:relative; overflow:hidden;
    background:linear-gradient(160deg,#0c1222 0%,#0a0e1a 100%);
    border:1px solid var(--edge);
    display:flex; flex-direction:column; justify-content:center; padding:8cqw 9cqw;
  }
  h1{ margin:0; font-weight:800; letter-spacing:-.06cqw; font-size:5.4cqw; line-height:1.1; max-width:92%; }
  .rule{ width:9cqw; height:.5cqw; border-radius:.5cqw; margin:3.4cqw 0 3cqw;
         background:linear-gradient(90deg,var(--accent),var(--purple),var(--pink)); }
  .meta{ display:flex; flex-direction:column; gap:.9cqw; font-size:2.0cqw; color:var(--muted);
         font-family:ui-monospace,monospace; }
  .meta .who{ color:var(--ink); }
  .meta .who b{ color:#fff; }
</style></head>
<body>
<div class="slide">
  <h1>Memory OS of AI Agent</h1>
  <div class="rule"></div>
  <div class="meta">
    <span class="date">2026. 10.</span>
    <span class="who">presenter: <b>Joohyung Yun</b></span>
  </div>
</div>
</body></html>
