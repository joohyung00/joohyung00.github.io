<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>memoryos — Operating System Principles Reused in MemoryOS</title>
<style>
  :root{
    --bg:#0a0e1a; --bg2:#0f1525; --panel:#161f35; --panel2:#1b2640;
    --ink:#eef3fb; --muted:#9aa7c5; --dim:#5a6a8a;
    --accent:#7cc4ff; --amber:#ffc06b; --ok:#7ee787; --warn:#ff7b72;
    --purple:#c084fc; --pink:#ff8fd8; --edge:#2a3a58; --code-bg:#050810;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(ellipse at top,var(--bg2) 0%,var(--bg) 60%) fixed,var(--bg);
    display:grid; place-items:center; min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",Roboto,sans-serif;
    color:var(--ink);
  }
  .slide{
    width:min(100vw,177.78vh); aspect-ratio:16/9;
    container-type:size; position:relative; overflow:hidden;
    background:linear-gradient(160deg,#0c1222 0%,#0a0e1a 100%);
    border:1px solid var(--edge);
    display:flex; flex-direction:column; padding:5.6cqw 6cqw 5cqw;
  }
  /* ---- header ---- */
  h1{ margin:0; font-weight:800; letter-spacing:-.05cqw; font-size:3.6cqw; line-height:1.08; padding-bottom:1.4cqw; border-bottom:1px solid var(--edge); }
  /* .grad stays available for the cover only; slide titles are plain formal text. */
  h1 .grad{ background:linear-gradient(135deg,var(--accent),var(--purple),var(--pink)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  /* ---- body ---- */
  .body{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:1.4cqw; }
  /* .lead: legacy only (pre-260916 decks). New slides carry no lead/subtitle line. */
  .lead{ color:var(--muted); font-size:2.0cqw; margin:0; line-height:1.45; }
  p,li{ font-size:2.0cqw; line-height:1.45; margin:.4cqw 0; }
  /* ---- bullets: the default body form — keyword phrases, not sentences ---- */
  ul{ margin:0; padding-left:2.4cqw; list-style:none; }
  ul li{ position:relative; margin:.7cqw 0; }
  ul li::before{ content:"–"; position:absolute; left:-2.2cqw; color:var(--purple); font-weight:700; }
  ul ul{ margin:.3cqw 0; }
  ul ul li{ font-size:1.7cqw; color:var(--muted); }
  ul ul li::before{ content:"·"; color:var(--dim); }
  .small{ font-size:1.55cqw; color:var(--muted); }
  b,strong{ color:#fff; }
  .accent{color:var(--accent);} .ok{color:var(--ok);} .warn{color:var(--warn);}
  .amber{color:var(--amber);} .purple{color:var(--purple);} .pink{color:var(--pink);} .dim{color:var(--dim);}
  .math{ font-family:"Cambria Math",Georgia,"Times New Roman",serif; }
  .slot{ font-family:"Cambria Math",Georgia,serif; color:var(--pink); }
  code{ font-family:ui-monospace,"JetBrains Mono",monospace; background:var(--panel); color:var(--amber); padding:.1cqw .6cqw; border-radius:.5cqw; border:1px solid var(--edge); font-size:.85em; }
  /* ---- common components (use as needed; delete unused is fine) ---- */
  .card{ background:var(--panel); border:1px solid var(--edge); border-radius:1.1cqw; padding:1.4cqw 1.7cqw; }
  .two{ display:grid; grid-template-columns:1fr 1fr; gap:1.6cqw; }
  .three{ display:grid; grid-template-columns:repeat(3,1fr); gap:1.4cqw; }
  table{ width:100%; border-collapse:collapse; font-size:1.65cqw; }
  th,td{ border:1px solid var(--edge); padding:.7cqw 1cqw; text-align:left; vertical-align:middle; }
  th{ background:var(--bg2); color:var(--accent); font-weight:700; }
  .num{ text-align:right; font-family:ui-monospace,monospace; }
  .chip{ display:inline-block; padding:.35cqw 1.1cqw; border-radius:5cqw; font-size:1.4cqw; font-weight:700; border:1px solid var(--accent); color:var(--accent); background:rgba(124,196,255,.12); }
  .chip.ok{ border-color:var(--ok); color:var(--ok); background:rgba(126,231,135,.12); }
  .chip.warn{ border-color:var(--warn); color:var(--warn); background:rgba(255,123,114,.12); }
  .note{ background:rgba(124,196,255,.07); border-left:.4cqw solid var(--accent); padding:1cqw 1.5cqw; border-radius:0 .8cqw .8cqw 0; font-size:1.7cqw; }
  .callout{ background:linear-gradient(135deg,rgba(192,132,252,.10),rgba(124,196,255,.06)); border:1px solid var(--purple); border-radius:1.1cqw; padding:1.3cqw 1.7cqw; font-size:1.9cqw; }
  svg{ width:100%; height:auto; display:block; }
  /* ---- footer: page number only ---- */
  .foot{ position:absolute; right:6cqw; bottom:2.6cqw; font-size:1.3cqw; color:var(--dim); font-family:ui-monospace,monospace; }
</style><style>
  .navs{ display:flex; gap:.7cqw; margin:-.3cqw 0 .3cqw; }
  .nv{ font-family:ui-monospace,monospace; font-size:1.2cqw; padding:.15cqw .9cqw; border:1px solid var(--edge); border-radius:3cqw; color:var(--dim); }
  .nv.cur{ border-color:var(--amber); color:var(--amber); background:rgba(255,192,107,.12); font-weight:700; }
  .mapstrip{ margin:-.5cqw 0 .5cqw; }
  .mapstrip svg{ width:100%; display:block; }
  .st{ opacity:.1; transition:opacity .3s; }
  .st.shown{ opacity:1; }
  .slide.anim{ cursor:pointer; }
  .ctrl{ position:absolute; left:6cqw; bottom:2.2cqw; display:flex; gap:.8cqw; align-items:center; font-family:ui-monospace,monospace; font-size:1.25cqw; color:var(--dim); }
  .ctrl button{ font:inherit; color:var(--accent); background:rgba(124,196,255,.1); border:1px solid var(--accent); border-radius:.6cqw; padding:.15cqw .8cqw; cursor:pointer; }
</style></head>
<body>
<!-- notes:
아이디어는 OS 의 메모리 관리 원칙을 대화 기억에 그대로 옮긴 것. 세 가지 대응: ① Multics 의 세그먼트-페이지 → 토픽 폴더(segment) 안의 대화 페이지. ② LRU/working set 처럼 뜨거운 데이터만 남김 → heat(방문·크기·최근성) 로 차가운 폴더는 삭제, 뜨거운 폴더는 persona 로 승격. ③ cache→RAM→disk 계층 → STM→MTM→LPM.
이 장은 "왜 OS 냐"에 대한 답. 다음 장(개요)에서 네 모듈이 이 원칙 위에서 어떻게 도는지 봄.
-->
<div class="slide">
  <h1>Operating System Principles Reused in MemoryOS</h1>
  <div class="body">
    <!-- optional: one image/diagram (inline <svg>) -->
    <!-- then bullets (keyword phrases):
    <ul>
      <li><b>keyword</b> · short phrase</li>
      <li>another phrase</li>
    </ul> -->

<svg viewBox="0 0 1200 470">
  <defs><marker id="ar9" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#ffc06b"/></marker></defs>
  <g font-size="13" fill="#eef3fb">
    <text x="290" y="24" font-size="15" font-weight="700" fill="#9aa7c5" text-anchor="middle">operating system</text>
    <text x="910" y="24" font-size="15" font-weight="700" fill="#ffc06b" text-anchor="middle">MemoryOS</text>

    <!-- row 1 : segment-page -->
    <rect x="20" y="40" width="540" height="128" rx="12" fill="#161f35" stroke="#2a3a58"/>
    <text x="40" y="68" font-size="16" font-weight="800">segment–page memory</text>
    <text x="40" y="94" fill="#9aa7c5">logical segments subdivided into fixed pages (Multics)</text>
    <text x="40" y="116" fill="#9aa7c5">segment metadata → no external fragmentation</text>
    <text x="40" y="138" fill="#9aa7c5">paging → little internal fragmentation</text>
    <g stroke-width="1.3">
      <rect x="430" y="60" width="112" height="40" rx="6" fill="#0f1525" stroke="#9aa7c5"/>
      <rect x="436" y="66" width="22" height="28" rx="2" fill="#2a3a58"/><rect x="462" y="66" width="22" height="28" rx="2" fill="#2a3a58"/><rect x="488" y="66" width="22" height="28" rx="2" fill="#2a3a58"/><rect x="514" y="66" width="22" height="28" rx="2" fill="#2a3a58"/>
      <rect x="430" y="108" width="112" height="40" rx="6" fill="#0f1525" stroke="#9aa7c5"/>
      <rect x="436" y="114" width="22" height="28" rx="2" fill="#2a3a58"/><rect x="462" y="114" width="22" height="28" rx="2" fill="#2a3a58"/><rect x="488" y="114" width="22" height="28" rx="2" fill="#2a3a58"/>
    </g>
    <text x="486" y="160" font-size="11.5" fill="#5a6a8a" text-anchor="middle">segment ⊃ pages</text>
    <line x1="572" y1="104" x2="626" y2="104" stroke="#ffc06b" stroke-width="2.2" marker-end="url(#ar9)"/>
    <rect x="640" y="40" width="540" height="128" rx="12" fill="#1d1630" stroke="#c084fc"/>
    <text x="660" y="68" font-size="16" font-weight="800" fill="#c084fc">topic folders of dialogue pages</text>
    <text x="660" y="94" fill="#9aa7c5">a page = one turn {Q, R, T} · a folder = one topic</text>
    <text x="660" y="116" fill="#9aa7c5">folder carries an LLM summary and keywords</text>
    <text x="660" y="138" fill="#9aa7c5">pages join the folder whose match score is highest</text>
    <g stroke-width="1.3">
      <path d="M1050,62 L1090,62 L1098,70 L1162,70 L1162,100 L1050,100 Z" fill="#1d1630" stroke="#c084fc"/>
      <rect x="1058" y="76" width="20" height="18" rx="2" fill="#2b1f4a"/><rect x="1082" y="76" width="20" height="18" rx="2" fill="#2b1f4a"/><rect x="1106" y="76" width="20" height="18" rx="2" fill="#2b1f4a"/>
      <path d="M1050,110 L1090,110 L1098,118 L1162,118 L1162,148 L1050,148 Z" fill="#1d1630" stroke="#c084fc"/>
      <rect x="1058" y="124" width="20" height="18" rx="2" fill="#2b1f4a"/><rect x="1082" y="124" width="20" height="18" rx="2" fill="#2b1f4a"/>
    </g>
    <text x="1106" y="160" font-size="11.5" fill="#5a6a8a" text-anchor="middle">folder ⊃ pages</text>

    <!-- row 2 : hot data -->
    <rect x="20" y="186" width="540" height="128" rx="12" fill="#161f35" stroke="#2a3a58"/>
    <text x="40" y="214" font-size="16" font-weight="800">priority-based eviction keeps hot data</text>
    <text x="40" y="240" fill="#9aa7c5">LRU, working-set models: recently and often used</text>
    <text x="40" y="262" fill="#9aa7c5">data stays resident, the rest is paged out</text>
    <text x="40" y="284" fill="#9aa7c5">coarse segments + fine pages minimize overhead</text>
    <g stroke-width="1.3">
      <rect x="440" y="204" width="24" height="90" rx="12" fill="#0f1525" stroke="#9aa7c5"/>
      <rect x="446" y="246" width="12" height="42" rx="6" fill="#ff7b72"/>
      <text x="490" y="222" font-size="11.5" fill="#9aa7c5">hot · keep</text>
      <text x="490" y="290" font-size="11.5" fill="#5a6a8a">cold · evict</text>
    </g>
    <line x1="572" y1="250" x2="626" y2="250" stroke="#ffc06b" stroke-width="2.2" marker-end="url(#ar9)"/>
    <rect x="640" y="186" width="540" height="128" rx="12" fill="#2b2413" stroke="#ffc06b"/>
    <text x="660" y="214" font-size="16" font-weight="800" fill="#ffc06b">heat-based eviction and promotion</text>
    <text x="660" y="240" fill="#9aa7c5">heat = visits + number of pages + recency</text>
    <text x="660" y="262" fill="#9aa7c5">coldest folder is evicted when the store is full</text>
    <text x="660" y="284" fill="#9aa7c5">hot folder (heat &gt; τ) is promoted to the persona tier</text>
    <g stroke-width="1.3">
      <rect x="1060" y="204" width="24" height="90" rx="12" fill="#0f1525" stroke="#ffc06b"/>
      <rect x="1066" y="226" width="12" height="62" rx="6" fill="#ffc06b"/>
      <line x1="1052" y1="238" x2="1092" y2="238" stroke="#eef3fb" stroke-dasharray="3 2"/>
      <text x="1100" y="242" font-size="11.5" fill="#eef3fb">τ</text>
      <text x="1110" y="222" font-size="11.5" fill="#7ee787">promote</text>
      <text x="1110" y="290" font-size="11.5" fill="#5a6a8a">evict</text>
    </g>

    <!-- row 3 : hierarchy -->
    <rect x="20" y="332" width="540" height="128" rx="12" fill="#161f35" stroke="#2a3a58"/>
    <text x="40" y="360" font-size="16" font-weight="800">storage hierarchy</text>
    <text x="40" y="386" fill="#9aa7c5">cache → main memory → disk</text>
    <text x="40" y="408" fill="#9aa7c5">small and fast near the processor,</text>
    <text x="40" y="430" fill="#9aa7c5">large and slow further away</text>
    <g font-size="11.5" fill="#9aa7c5" text-anchor="middle">
      <rect x="470" y="350" width="60" height="26" rx="5" fill="#0f1525" stroke="#9aa7c5"/><text x="500" y="367">cache</text>
      <rect x="450" y="384" width="100" height="26" rx="5" fill="#0f1525" stroke="#9aa7c5"/><text x="500" y="401">RAM</text>
      <rect x="430" y="418" width="140" height="26" rx="5" fill="#0f1525" stroke="#9aa7c5"/><text x="500" y="435">disk</text>
    </g>
    <line x1="572" y1="396" x2="626" y2="396" stroke="#ffc06b" stroke-width="2.2" marker-end="url(#ar9)"/>
    <rect x="640" y="332" width="540" height="128" rx="12" fill="#161f35" stroke="#2a3a58"/>
    <text x="660" y="360" font-size="16" font-weight="800">three memory tiers by lifetime</text>
    <text x="660" y="386" fill="#9aa7c5"><tspan fill="#7cc4ff" font-weight="700">STM</tspan> recent turns → <tspan fill="#c084fc" font-weight="700">MTM</tspan> topic folders → <tspan fill="#7ee787" font-weight="700">LPM</tspan> persona</text>
    <text x="660" y="408" fill="#9aa7c5">short-term · mid-term · long-term personal</text>
    <text x="660" y="430" fill="#9aa7c5">what moves between tiers is decided by FIFO and heat</text>
    <g font-size="11.5" text-anchor="middle">
      <rect x="1090" y="350" width="60" height="26" rx="5" fill="#10233a" stroke="#7cc4ff"/><text x="1120" y="367" fill="#7cc4ff">STM</text>
      <rect x="1070" y="384" width="100" height="26" rx="5" fill="#1d1630" stroke="#c084fc"/><text x="1120" y="401" fill="#c084fc">MTM</text>
      <rect x="1050" y="418" width="140" height="26" rx="5" fill="#0f2a1c" stroke="#7ee787"/><text x="1120" y="435" fill="#7ee787">LPM</text>
    </g>
  </g>
</svg>
<ul>
  <li><b>same three principles</b> · segments of pages · keep the hot, evict the cold · tiers by lifetime</li>
</ul>

  </div>
  <div class="foot">09 / 25</div>
</div>
</body></html>
