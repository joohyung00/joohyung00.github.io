<!-- notes:
기존 메모리 방법 세 계열, 방법마다 그림 하나.
TiM: 원문 턴을 버리고 답한 뒤 "post-think" 로 뽑은 한 줄 생각(thought)만 저장. 검색은 LSH: 비슷한 생각은 같은 bucket 에 해시되므로 질의가 떨어진 bucket 을 읽음. insert/merge/forget 로 생각을 관리.
A-Mem: 턴마다 LLM 이 구조화된 노트(키워드·태그·문맥)를 쓰고 관련 노트와 링크. 새 노트가 옛 노트의 문맥·태그를 고칠 수 있음(memory evolution). 세션을 넘어 그래프가 자람.
MemoryBank: 벡터 DB 에 들어가는 것 = 하루치 대화 로그, 이벤트 요약, 사용자 초상(traits). 각 항목은 임베딩+시각. 강도가 Ebbinghaus 곡선으로 줄고, 회상되면 복원. 약한 항목은 잊혀짐.
MemGPT: 창 안의 main context 와 창 밖의 external context(recall/archival). 모델 자신이 read/write 함수 호출로 페이지를 넣고 뺌. OS 식 계층.
논문이 같은 계열로 드는 SCM, AI-town, EmotionalRAG 는 실험 비교군이 아니라 생략. 역사 순서가 아니라 "무엇을 하느냐" 분류.
-->
