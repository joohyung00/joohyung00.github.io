<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>memoryos — Long-Term Memory in Multi-Session Conversation</title>
<style>
  :root{
    --bg:#0a0e1a; --bg2:#0f1525; --panel:#161f35; --panel2:#1b2640;
    --ink:#eef3fb; --muted:#9aa7c5; --dim:#5a6a8a;
    --accent:#7cc4ff; --amber:#ffc06b; --ok:#7ee787; --warn:#ff7b72;
    --purple:#c084fc; --pink:#ff8fd8; --edge:#2a3a58; --code-bg:#050810;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(ellipse at top,var(--bg2) 0%,var(--bg) 60%) fixed,var(--bg);
    display:grid; place-items:center; min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",Roboto,sans-serif;
    color:var(--ink);
  }
  .slide{
    width:min(100vw,177.78vh); aspect-ratio:16/9;
    container-type:size; position:relative; overflow:hidden;
    background:linear-gradient(160deg,#0c1222 0%,#0a0e1a 100%);
    border:1px solid var(--edge);
    display:flex; flex-direction:column; padding:5.6cqw 6cqw 5cqw;
  }
  /* ---- header ---- */
  h1{ margin:0; font-weight:800; letter-spacing:-.05cqw; font-size:3.6cqw; line-height:1.08; padding-bottom:1.4cqw; border-bottom:1px solid var(--edge); }
  /* .grad stays available for the cover only; slide titles are plain formal text. */
  h1 .grad{ background:linear-gradient(135deg,var(--accent),var(--purple),var(--pink)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  /* ---- body ---- */
  .body{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:1.4cqw; }
  /* .lead: legacy only (pre-260916 decks). New slides carry no lead/subtitle line. */
  .lead{ color:var(--muted); font-size:2.0cqw; margin:0; line-height:1.45; }
  p,li{ font-size:2.0cqw; line-height:1.45; margin:.4cqw 0; }
  /* ---- bullets: the default body form — keyword phrases, not sentences ---- */
  ul{ margin:0; padding-left:2.4cqw; list-style:none; }
  ul li{ position:relative; margin:.7cqw 0; }
  ul li::before{ content:"–"; position:absolute; left:-2.2cqw; color:var(--purple); font-weight:700; }
  ul ul{ margin:.3cqw 0; }
  ul ul li{ font-size:1.7cqw; color:var(--muted); }
  ul ul li::before{ content:"·"; color:var(--dim); }
  .small{ font-size:1.55cqw; color:var(--muted); }
  b,strong{ color:#fff; }
  .accent{color:var(--accent);} .ok{color:var(--ok);} .warn{color:var(--warn);}
  .amber{color:var(--amber);} .purple{color:var(--purple);} .pink{color:var(--pink);} .dim{color:var(--dim);}
  .math{ font-family:"Cambria Math",Georgia,"Times New Roman",serif; }
  .slot{ font-family:"Cambria Math",Georgia,serif; color:var(--pink); }
  code{ font-family:ui-monospace,"JetBrains Mono",monospace; background:var(--panel); color:var(--amber); padding:.1cqw .6cqw; border-radius:.5cqw; border:1px solid var(--edge); font-size:.85em; }
  /* ---- common components (use as needed; delete unused is fine) ---- */
  .card{ background:var(--panel); border:1px solid var(--edge); border-radius:1.1cqw; padding:1.4cqw 1.7cqw; }
  .two{ display:grid; grid-template-columns:1fr 1fr; gap:1.6cqw; }
  .three{ display:grid; grid-template-columns:repeat(3,1fr); gap:1.4cqw; }
  table{ width:100%; border-collapse:collapse; font-size:1.65cqw; }
  th,td{ border:1px solid var(--edge); padding:.7cqw 1cqw; text-align:left; vertical-align:middle; }
  th{ background:var(--bg2); color:var(--accent); font-weight:700; }
  .num{ text-align:right; font-family:ui-monospace,monospace; }
  .chip{ display:inline-block; padding:.35cqw 1.1cqw; border-radius:5cqw; font-size:1.4cqw; font-weight:700; border:1px solid var(--accent); color:var(--accent); background:rgba(124,196,255,.12); }
  .chip.ok{ border-color:var(--ok); color:var(--ok); background:rgba(126,231,135,.12); }
  .chip.warn{ border-color:var(--warn); color:var(--warn); background:rgba(255,123,114,.12); }
  .note{ background:rgba(124,196,255,.07); border-left:.4cqw solid var(--accent); padding:1cqw 1.5cqw; border-radius:0 .8cqw .8cqw 0; font-size:1.7cqw; }
  .callout{ background:linear-gradient(135deg,rgba(192,132,252,.10),rgba(124,196,255,.06)); border:1px solid var(--purple); border-radius:1.1cqw; padding:1.3cqw 1.7cqw; font-size:1.9cqw; }
  svg{ width:100%; height:auto; display:block; }
  /* ---- footer: page number only ---- */
  .foot{ position:absolute; right:6cqw; bottom:2.6cqw; font-size:1.3cqw; color:var(--dim); font-family:ui-monospace,monospace; }
</style><style>
  .navs{ display:flex; gap:.7cqw; margin:-.3cqw 0 .3cqw; }
  .nv{ font-family:ui-monospace,monospace; font-size:1.2cqw; padding:.15cqw .9cqw; border:1px solid var(--edge); border-radius:3cqw; color:var(--dim); }
  .nv.cur{ border-color:var(--amber); color:var(--amber); background:rgba(255,192,107,.12); font-weight:700; }
  .mapstrip{ margin:-.5cqw 0 .5cqw; }
  .mapstrip svg{ width:100%; display:block; }
  .st{ opacity:.1; transition:opacity .3s; }
  .st.shown{ opacity:1; }
  .slide.anim{ cursor:pointer; }
  .ctrl{ position:absolute; left:6cqw; bottom:2.2cqw; display:flex; gap:.8cqw; align-items:center; font-family:ui-monospace,monospace; font-size:1.25cqw; color:var(--dim); }
  .ctrl button{ font:inherit; color:var(--accent); background:rgba(124,196,255,.1); border:1px solid var(--accent); border-radius:.6cqw; padding:.15cqw .8cqw; cursor:pointer; }
</style></head>
<body>
<!-- notes:
푸는 문제를 러닝 예시로. 1주차 세션 세 턴(공원·다람쥐·달리기, "살 빼겠다"). 몇 주 뒤 같은 사용자가 공원을 묻고, 버거를 추천해 달라고 한다.
기본 LLM(빨강)은 기억이 없어 "모른다"고 하고, 버거 추천도 아무거나. MemoryOS(앰버)는 사실을 회상하고, 체중 감량 목표를 끌어와 "헬스장 잊지 마"까지.
시험하는 능력 두 가지: 사실 회상(fact recall) + 개인화(personalization). 이 예시가 덱 끝까지 반복된다.
세션 전제: 세션은 물리적으로 분리돼 있고(LoCoMo 는 날짜가 다른 세션 수십 개, GVD 는 10일), 한 사용자의 모든 세션이 메모리 하나를 공유한다.
Claude/ChatGPT 처럼 사용자가 주제별 대화방을 나누는 게 아니라, 시스템이 턴을 토픽 폴더(segment)로 자동 배정한다. 세션 경계는 chain 이 reset 되는 지점으로만 드러난다.
-->
<div class="slide">
  <h1>Long-Term Memory in Multi-Session Conversation</h1>
  <div class="body">
    <!-- optional: one image/diagram (inline <svg>) -->
    <!-- then bullets (keyword phrases):
    <ul>
      <li><b>keyword</b> · short phrase</li>
      <li>another phrase</li>
    </ul> -->

<svg viewBox="0 0 1200 470" style="width:88%; display:block; margin:0 auto;">
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#9aa7c5"/></marker></defs>
  <!-- week 1 session -->
  <text x="0" y="22" fill="#7cc4ff" font-size="14" font-weight="700">week 1 · one session</text>
  <rect x="0" y="36" width="470" height="404" rx="12" fill="#161f35" stroke="#2a3a58"/>
  <g font-size="13.5">
    <rect x="18" y="54" width="434" height="58" rx="10" fill="#10233a" stroke="#7cc4ff"/>
    <text x="32" y="78" fill="#eef3fb">U · I went to the wetland park last week,</text>
    <text x="32" y="98" fill="#eef3fb">the scenery there was beautiful.</text>
    <text x="32" y="134" fill="#9aa7c5" font-size="12.5">A · Sounds like a relaxing experience!</text>

    <rect x="18" y="156" width="434" height="58" rx="10" fill="#10233a" stroke="#7cc4ff"/>
    <text x="32" y="180" fill="#eef3fb">U · There were many little squirrels running</text>
    <text x="32" y="200" fill="#eef3fb">in the trees, very cute.</text>
    <text x="32" y="236" fill="#9aa7c5" font-size="12.5">A · I like squirrels, they signal a healthy environment.</text>

    <rect x="18" y="258" width="434" height="58" rx="10" fill="#10233a" stroke="#7cc4ff"/>
    <text x="32" y="282" fill="#eef3fb">U · I ran two laps in the park and felt great.</text>
    <text x="32" y="302" fill="#eef3fb">I'll keep working out to get slimmer.</text>
    <text x="32" y="338" fill="#9aa7c5" font-size="12.5">A · Exercise is good for health. I'll keep you motivated!</text>
  </g>
  <g font-size="12" fill="#5a6a8a">
    <text x="18" y="378">three turns · each turn = one page</text>
    <text x="18" y="400">facts: park · squirrels · ran two laps</text>
    <text x="18" y="422">preference: wants to get slimmer</text>
  </g>

  <!-- gap -->
  <line x1="478" y1="238" x2="552" y2="238" stroke="#9aa7c5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="515" y="22" fill="#ffc06b" font-size="14" font-weight="700" text-anchor="middle">a few weeks later · a separate session</text>
  <line x1="515" y1="30" x2="515" y2="440" stroke="#ffc06b" stroke-width="1" stroke-dasharray="3 5" opacity=".5"/>

  <!-- later question 1 -->
  <rect x="560" y="36" width="640" height="40" rx="10" fill="#2b2413" stroke="#ffc06b"/>
  <text x="576" y="61" fill="#eef3fb" font-size="14">U · Remember the wetland park I told you about?</text>
  <rect x="560" y="88" width="310" height="92" rx="10" fill="rgba(255,123,114,.08)" stroke="#ff7b72"/>
  <text x="576" y="110" fill="#ff7b72" font-size="12.5" font-weight="700">without memory</text>
  <text x="576" y="138" fill="#eef3fb" font-size="13.5">Sorry, I don't remember you</text>
  <text x="576" y="158" fill="#eef3fb" font-size="13.5">mentioning the park.</text>
  <rect x="890" y="88" width="310" height="92" rx="10" fill="#2b2413" stroke="#ffc06b"/>
  <text x="906" y="110" fill="#ffc06b" font-size="12.5" font-weight="700">with MemoryOS</text>
  <text x="906" y="138" fill="#eef3fb" font-size="13.5">You saw beautiful scenery, went</text>
  <text x="906" y="158" fill="#eef3fb" font-size="13.5">for a run, and saw squirrels.</text>
  <rect x="560" y="192" width="170" height="24" rx="12" fill="rgba(124,196,255,.12)" stroke="#7cc4ff"/>
  <text x="645" y="208" fill="#7cc4ff" font-size="12.5" font-weight="700" text-anchor="middle">tests · fact recall</text>

  <!-- later question 2 -->
  <rect x="560" y="246" width="640" height="40" rx="10" fill="#2b2413" stroke="#ffc06b"/>
  <text x="576" y="271" fill="#eef3fb" font-size="14">U · I feel like eating a burger, any recommendations?</text>
  <rect x="560" y="298" width="310" height="92" rx="10" fill="rgba(255,123,114,.08)" stroke="#ff7b72"/>
  <text x="576" y="320" fill="#ff7b72" font-size="12.5" font-weight="700">without memory</text>
  <text x="576" y="348" fill="#eef3fb" font-size="13.5">Teriyaki chicken burger,</text>
  <text x="576" y="368" fill="#eef3fb" font-size="13.5">it's super delicious!</text>
  <rect x="890" y="298" width="310" height="92" rx="10" fill="#2b2413" stroke="#ffc06b"/>
  <text x="906" y="320" fill="#ffc06b" font-size="12.5" font-weight="700">with MemoryOS</text>
  <text x="906" y="348" fill="#eef3fb" font-size="13.5">The cheeseburger [...], just don't</text>
  <text x="906" y="368" fill="#eef3fb" font-size="13.5">forget you're hitting the gym!</text>
  <rect x="560" y="402" width="190" height="24" rx="12" fill="rgba(126,231,135,.12)" stroke="#7ee787"/>
  <text x="655" y="418" fill="#7ee787" font-size="12.5" font-weight="700" text-anchor="middle">tests · personalization</text>
</svg>
<ul>
  <li><b>fact recall</b> · answer from what was said weeks ago, across sessions</li>
  <li><b>personalization</b> · act on what the user wants without being told again</li>
  <li><b>one memory per user</b> · spans separate sessions · topics grouped by the system, not by the user</li>
</ul>

  </div>
  <div class="foot">02 / 25</div>
</div>
</body></html>
