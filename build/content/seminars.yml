  summary: "LLM-based schema matching for data ingestion when the data itself cannot be shown: object-type detection, reducing the task to attribute mapping, NER and double-RAG filters, the key detector, and the ablations. Ends with my own take."
- key: stark-2024-05
  title: "STaRK: Benchmarking LLM Retrieval on Textual and Relational Knowledge Bases"
