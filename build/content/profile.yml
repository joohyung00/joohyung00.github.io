about:
  - >-
    I am a fourth-year integrated M.S./Ph.D. student (second year of the Ph.D.) in Computer Science at
    <a href="https://postech.ac.kr">POSTECH</a>, advised by Prof. <a href="https://wscrony.github.io">Wook-Shin Han</a>
    in the <a href="https://dslab.postech.ac.kr">Data Systems Lab</a>. I work where natural language processing meets
    information retrieval: <b>retrieval-augmented generation</b> over complex, real-world documents that mix text, tables, and images.
  - >-
    My recent work treats retrieval as something an <b>agent</b> does rather than a single lookup: traversing document
    structure, noticing when a path fails, and backtracking with that feedback. Next, I want these systems to be trustworthy
    at <b>enterprise scale</b>: verifiable answers over knowledge graphs and multimodal corpora.
research:
  - {topic: Multimodal multihop retrieval, text: "Finding evidence scattered across the text, tables, and images of many documents, at the right granularity.", papers: "LILaC · HELIOS"}
  - {topic: Agentic document RAG, text: "Agents that traverse document structure, detect a failed path, and backtrack using that failure as feedback.", papers: "FiF · ongoing"}
  - {topic: "Structured &amp; enterprise data", text: "Schema discovery, knowledge graphs, and verifiable answers over heterogeneous enterprise data.", papers: "ReCG · CRAG"}
